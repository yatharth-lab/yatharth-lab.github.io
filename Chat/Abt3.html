<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reels Engine V6 Stable</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
body{margin:0;background:#000;overflow:hidden;font-family:Arial}
.feed-container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}
.reel-item{
  height:100vh;
  scroll-snap-align:start;
  position:relative;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
}
iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<!-- Sound unlock -->
<div id="soundPrompt" style="position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;">
<h2 style="color:white;margin-bottom:20px">🔊 Tap to Start</h2>
<button id="startBtn" style="padding:15px 30px;background:red;color:white;border-radius:10px;">START</button>
</div>

<div class="feed-container" id="feed"></div>

<script>
const API_KEY = "AIzaSyC...YOUR_KEY";
const CHANNELS = [
  "UCC6gbNO098rkQKCU0ZaLITQ",
  "UCexXxAXCo36y-IU7rkI2h6A"
];

const feed = document.getElementById("feed");

let activeIndex = 0;
let reels = [];

// fallback
const FALLBACK = [
  "J---aiyznGQ",
  "hT_nvWreIhg",
  "3K0RzZcGzP4",
  "dQw4w9WgXcQ"
];

function createReel(id){
  const div = document.createElement("div");
  div.className = "reel-item";

  const iframe = document.createElement("iframe");
  iframe.dataset.id = id;
  iframe.src = `https://www.youtube.com/embed/${id}?enablejsapi=1&rel=0&controls=1&mute=1&playsinline=1`;

  div.appendChild(iframe);
  feed.appendChild(div);

  return iframe;
}

// pause all except active
function setActive(index){
  reels.forEach((r,i)=>{
    const src = r.dataset.id;
    if(i === index){
      r.src = `https://www.youtube.com/embed/${src}?enablejsapi=1&rel=0&controls=1&mute=1&autoplay=1&playsinline=1`;
    } else {
      r.src = `https://www.youtube.com/embed/${src}?enablejsapi=1&rel=0&controls=1&mute=1&playsinline=1`;
    }
  });
}

async function load(){
  // simple fallback (stable)
  FALLBACK.forEach(id=>{
    reels.push(createReel(id));
  });

  setTimeout(()=>setActive(0),500);
}

// scroll detection
feed.addEventListener("scroll", ()=>{
  const index = Math.round(feed.scrollTop / window.innerHeight);
  if(index !== activeIndex){
    activeIndex = index;
    setActive(index);
  }
});

// start button (mobile audio unlock)
document.getElementById("startBtn").addEventListener("click",()=>{
  document.getElementById("soundPrompt").remove();
  load();
});
</script>

</body>
</html>
