<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reels Engine V5 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            margin: 0;
            background: #000;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent body scroll */
        }

        /* Feed Container with Scroll Snapping */
        .feed-container {
            height: 100vh;
            height: 100dvh; /* Better mobile support */
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        /* Hide scrollbars for a clean app-like look */
        .feed-container::-webkit-scrollbar {
            display: none;
        }
        .feed-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Individual Reel Item */
        .reel-item {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            position: relative;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }

        .reel-item iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }

        /* Text shadow for better readability over videos */
        .text-outline {
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8), 0px 0px 8px rgba(0,0,0,0.6);
        }

        /* Loader Animation */
        .loader {
            border-top-color: #ef4444; /* Tailwind red-500 */
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-white bg-black">

<div id="soundPrompt" style="position:fixed;inset:0;background:#000;z-index:999999;display:flex;align-items:center;justify-content:center;flex-direction:column;">
    <h2 style="color:white;margin-bottom:20px">🔊 Tap To Enable Sound</h2>
    <button id="startBtn" style="padding:15px 35px;font-size:18px;border:none;border-radius:12px;background:#ff0000;color:white;font-weight:bold;">START REELS</button>
</div>

    
    <!-- Top Bar -->

    <!-- Feed Container -->

    </div>

    <script>
        
        // Configuration
        const API_KEY = "AIzaSyCHp00zE-ccExkdRODTnyY8mYV_jAYUyaI"; 
        
        const CHANNELS = [
            "UCC6gbNO098rkQKCU0ZaLITQ",
            "UCexXxAXCo36y-IU7rkI2h6A"
        ];

        // 🔥 FALLBACK DATA: Agar API Key kaam nahi karti, to ye load hoga blank screen ki jagah!
        const FALLBACK_VIDEOS = [
            { id: "J---aiyznGQ", channel: "MrBeast", title: "Would You Fly To Paris For A Baguette?" },
            { id: "hT_nvWreIhg", channel: "Marques Brownlee", title: "The Best Smartphone in the World!" },
            { id: "3K0RzZcGzP4", channel: "Zach King", title: "Jedi Illusion Magic Trick" },
            { id: "ZXsQAXx_ao0", channel: "Dude Perfect", title: "Insane Trick Shots!" },
            { id: "dQw4w9WgXcQ", channel: "Rick Astley", title: "Never Gonna Give You Up" }
        ];

        // State Management
        const seenVideos = new Set();
        let videoPool = [];
        let channelToken = {};
        CHANNELS.forEach(c => channelToken[c] = null);

        let activeChannels = [];
        let loading = false;
        let useFallback = false;

        const feedEl = document.getElementById("feed");
        const loadingScreen = document.getElementById("loading-screen");
        const errorText = document.getElementById("error-text");

        
        function shuffle(arr){
            for(let i = arr.length - 1; i > 0; i--){
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function refreshActiveChannels(){
            activeChannels = shuffle([...CHANNELS]).slice(0, 5);
        }

        
        async function fetchChannelVideos(channel){
            let url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${channel}&part=snippet,id&order=date&maxResults=5&type=video&videoDuration=short`;

            if(channelToken[channel]){
                url += `&pageToken=${channelToken[channel]}`;
            }

            try {
                const res = await fetch(url, { referrerPolicy: "no-referrer" });
                const data = await res.json();

                // If API Quota exceeds or API is invalid
                if(data.error) {
                    console.warn("YouTube API Warning (Switching to Fallbacks):", data.error.message);
                    useFallback = true;
                    return [];
                }

                if(!data.items) return [];

                channelToken[channel] = data.nextPageToken || null;

                return data.items
                    .filter(v => v.id.videoId)
                    .map(v => ({
                        id: v.id.videoId,
                        title: v.snippet.title,
                        channel: v.snippet.channelTitle,
                        time: new Date(v.snippet.publishedAt).getTime()
                    }));
            } catch(e) {
                console.error("Network/Fetch Error:", e);
                useFallback = true;
                return [];
            }
        }

        async function fetchVideos(){
            if(useFallback) {
                // If API is broken, simulate network delay and return fallbacks
                await new Promise(resolve => setTimeout(resolve, 800));
                return shuffle([...FALLBACK_VIDEOS]);
            }

            let results = [];
            refreshActiveChannels();

            for(let c of activeChannels){
                const vids = await fetchChannelVideos(c);
                results.push(...vids);
            }

            // Fallback injection if API returned literally nothing but no standard error
            if(results.length === 0 && !useFallback) {
                 useFallback = true;
                 return shuffle([...FALLBACK_VIDEOS]);
            }

            // Deduplication
            results = results.filter(v => {
                if(seenVideos.has(v.id)) return false;
                seenVideos.add(v.id);
                return true;
            });

            // Ranking mix (Recent + Random variance)
            results.sort((a, b) => {
                return (b.time - a.time) + (Math.random() * 3600000); 
            });

            return results;
        }


        function addToPool(videos){
            videoPool.push(...videos);
            if(videoPool.length > 80) {
                videoPool = videoPool.slice(-80);
            }
        }

        function cleanup(){
            if(videoPool.length > 80) videoPool = videoPool.slice(-80);
            if(seenVideos.size > 1500) seenVideos.clear();
        }

        function addReels(videos){
            videos.forEach(v => {
                const div = document.createElement("div");
                div.className = "reel-item";

                // 🔥 Fix: Using 'data-loaded' attribute to properly track iframe injection
                // 🔥 Added loop=1&playlist=${v.id} to ensure shorts don't just stop after 15 seconds
                const iframeSrc = `https://www.youtube.com/embed/${v.id}?autoplay=1&mute=0&playsinline=1&rel=0&controls=1&enablejsapi=1`;

                div.innerHTML = `
                    <iframe data-src="${iframeSrc}" data-loaded="false" allow="autoplay; fullscreen"></iframe>
                    
                    <!-- Content Info Overlay -->
                    <div class="absolute bottom-6 left-4 right-16 z-20 pointer-events-none text-outline flex flex-col gap-2">
                        <div class="flex items-center gap-2">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 to-pink-600 p-[2px]">
                                <div class="w-full h-full bg-black rounded-full flex items-center justify-center border-2 border-transparent">
                                    <i class="fas fa-user text-xs"></i>
                                </div>
                            </div>
                            <b class="text-sm font-bold tracking-wide">${v.channel}</b>
                            <button class="bg-transparent border border-white px-3 py-1 rounded-full text-xs font-semibold ml-2">Follow</button>
                        </div>
                        <p class="text-sm leading-tight text-gray-100 line-clamp-2">${v.title}</p>
                    </div>

                    <!-- Side Interaction Buttons -->
                    <div class="absolute bottom-6 right-2 z-20 flex flex-col gap-6 items-center pointer-events-auto">
                        <div class="flex flex-col items-center gap-1 cursor-pointer hover:scale-110 transition-transform">
                            <div class="w-12 h-12 bg-black/40 rounded-full flex items-center justify-center backdrop-blur-sm">
                                <i class="fas fa-heart text-2xl text-white hover:text-red-500 transition-colors"></i>
                            </div>
                            <span class="text-xs font-semibold text-outline">Like</span>
                        </div>
                        <div class="flex flex-col items-center gap-1 cursor-pointer hover:scale-110 transition-transform">
                            <div class="w-12 h-12 bg-black/40 rounded-full flex items-center justify-center backdrop-blur-sm">
                                <i class="fas fa-comment-dots text-2xl"></i>
                            </div>
                            <span class="text-xs font-semibold text-outline">Comment</span>
                        </div>
                        <div class="flex flex-col items-center gap-1 cursor-pointer hover:scale-110 transition-transform">
                            <div class="w-12 h-12 bg-black/40 rounded-full flex items-center justify-center backdrop-blur-sm">
                                <i class="fas fa-share text-2xl"></i>
                            </div>
                            <span class="text-xs font-semibold text-outline">Share</span>
                        </div>
                    </div>
                `;

                feedEl.appendChild(div);
            });

            observeReels();
        }

        
        let observer;

        function observeReels(){
            if(observer) observer.disconnect();

            const reels = document.querySelectorAll(".reel-item");

            observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    const iframe = entry.target.querySelector("iframe");
                    if(!iframe) return;

                    const isLoaded = iframe.getAttribute("data-loaded") === "true";
                    const originalSrc = iframe.getAttribute("data-src");

                    // 🔥 FIX APPLIED HERE:
                    // 1. Jab video screen pe aaye (isIntersecting) -> Play karein
                    // 2. Jab video screen se jaaye (!isIntersecting) -> Band karein (src hata dein) taaki audio na aaye

                    if(entry.isIntersecting) {
                        if (!isLoaded && originalSrc) {
                            // Sirf tab src set karein jab pehle set na ho
                            iframe.src = originalSrc;
                            iframe.setAttribute("data-loaded", "true");
                        }
                    } else {
                        // Agar video view se bahar hai, to src hata dein taaki audio aur video playback ruk jaye
                        if (isLoaded) {
                           // simple trick: src ko khaali karne se video stop ho jata hai
