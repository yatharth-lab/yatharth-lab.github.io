<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reels Engine V5 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body { margin: 0; background: #000; font-family: 'Inter', sans-serif; overflow: hidden; }

        .feed-container {
            height: 100vh; height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .feed-container::-webkit-scrollbar { display: none; }
        .feed-container { -ms-overflow-style: none; scrollbar-width: none; }

        .reel-item {
            height: 100vh; height: 100dvh;
            width: 100%;
            position: relative;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }

        .reel-item iframe {
            width: 100%; height: 100%;
            border: none; pointer-events: auto;
        }

        .text-outline {
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8), 0px 0px 8px rgba(0,0,0,0.6);
        }

        .loader {
            border-top-color: #ef4444;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-white bg-black">

<div id="soundPrompt" style="position:fixed;inset:0;background:#000;z-index:999999;display:flex;align-items:center;justify-content:center;flex-direction:column;">
    <h2 style="color:white;margin-bottom:20px">🔊 Tap To Enable Sound</h2>
    <button id="startBtn" style="padding:15px 35px;font-size:18px;border:none;border-radius:12px;background:#ff0000;color:white;font-weight:bold;">START REELS</button>
</div>

    
    <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-50 pointer-events-none">
        <h1 class="text-xl font-bold text-outline tracking-wider">Reels<span class="text-red-500">Pro</span></h1>
        <div class="flex gap-4 text-outline">
            <i class="fas fa-search text-xl"></i>
            <i class="fas fa-camera text-xl"></i>
        </div>
    </div>

    <div id="loading-screen" class="absolute inset-0 z-40 flex flex-col items-center justify-center bg-black transition-opacity duration-500">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-700 h-12 w-12 mb-4"></div>
        <p class="text-gray-300 font-semibold animate-pulse">Fetching Feed...</p>
    </div>

    <div class="feed-container" id="feed"></div>

    <script>
        const API_KEY = "AIzaSyCHp00zE-ccExkdRODTnyY8mYV_jAYUyaI"; 

        const CHANNELS = [
            "UC-lHJZR3Gqxm24_Vd_AJ5Yw", "UCXgGY0wkgOzynnHvSEVmE3A",
            "UC9CYT9gSN4X7d7I1xL1MYfA", "UC2t5bjwNC1VoD4cphC-dq9A",
            "UCvD3F2u6Coo2Q-CgZr5R3LA", "UCFzquvC1IGs6F-d5l0gqL7A",
            "UCF8aces9K4RzIv9I4RhE3QA", "UCzN-P1E3l0pD_q-p3KfJ5bA",
            "UCp55IdqYfD1VE5CUn5W5k0A", "UCwV8BbXl-1Mp8stEAd9Q8DA",
            "UCK_6tJ1q-0lEiC6E5c2u0cA", "UCNN3bX2N0t7pHxL0R3b7k0A",
            "UCY3M59JQwyY5O7MBlu2T1lw", "UCOO5OU3M141z1A2eWqG0vA",
            "UCW7RbTiPmUd5j3E7aM0d5cw", "UCfzlCWbYy5V3Ix7E_T5j0tw",
            "UCl8E1y8n4r7o6n5h0t4wA", "UCpD8s9n5T8zP8h0w2v3x9A"
        ];

        const SEARCH_QUERIES = [
            "funny moments", "prank", "challenge", "gaming", "vlog",
            "reaction", "roast", "dance", "singing", "comedy",
            "amazing tricks", "magic", "sports", "food", "travel"
        ];

        const FALLBACK_VIDEOS = [
            { id: "J---aiyznGQ", channel: "MrBeast", title: "Would You Fly To Paris For A Baguette?" },
            { id: "hT_nvWreIhg", channel: "Marques Brownlee", title: "The Best Smartphone in the World!" },
            { id: "3K0RzZcGzP4", channel: "Zach King", title: "Jedi Illusion Magic Trick" },
            { id: "dQw4w9WgXcQ", channel: "Rick Astley", title: "Never Gonna Give You Up" },
            { id: "jNQXAC9IVRw", channel: "Me at the zoo", title: "First Ever YouTube Video" },
            { id: "9bZkp7q19f0", channel: "PSY", title: "Gangnam Style" }
        ];

        const seenVideos = new Set();
        let videoPool = [];
        let channelToken = {};
        CHANNELS.forEach(c => channelToken[c] = null);

        let activeChannels = [];
        let loading = false;
        let useFallback = false;

        const feedEl = document.getElementById("feed");
        const loadingScreen = document.getElementById("loading-screen");

        function shuffle(arr){
            for(let i = arr.length - 1; i > 0; i--){
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function refreshActiveChannels(){
            activeChannels = shuffle([...CHANNELS]).slice(0, 12);
        }

        function getRandomQuery(){
            return shuffle([...SEARCH_QUERIES])[0];
        }

        async function fetchVideosBySearch(){
            const query = getRandomQuery();
            let url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&part=snippet,id&q=${query}&type=video&maxResults=15&videoDuration=short`;
            
            try {
                const res = await fetch(url, { referrerPolicy: "no-referrer" });
                const data = await res.json();
                if(data.error || !data.items) return [];
                
                return data.items
                    .filter(v => v.id.videoId && v.snippet.channelTitle)
                    .map(v => ({
                        id: v.id.videoId,
                        title: v.snippet.title,
                        channel: v.snippet.channelTitle,
                        time: new Date(v.snippet.publishedAt).getTime()
                    }));
            } catch(e) { return []; }
        }

        async function fetchChannelVideos(channel){
            let url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${channel}&part=snippet,id&order=date&maxResults=3&type=video&videoDuration=short`;
            if(channelToken[channel]) url += `&pageToken=${channelToken[channel]}`;

            try {
                const res = await fetch(url, { referrerPolicy: "no-referrer" });
                const data = await res.json();
                if(data.error) { useFallback = true; return []; }
                if(!data.items) return [];
                channelToken[channel] = data.nextPageToken || null;

                return data.items.filter(v => v.id.videoId).map(v => ({
                    id: v.id.videoId,
                    title: v.snippet.title,
                    channel: v.snippet.channelTitle,
                    time: new Date(v.snippet.publishedAt).getTime()
                }));
            } catch(e) { useFallback = true; return []; }
        }

        async function fetchVideos(){
            if(useFallback) { 
                await new Promise(resolve => setTimeout(resolve, 800)); 
                return shuffle([...FALLBACK_VIDEOS]); 
            }

            let results = [];
            
            if(Math.random() > 0.4){
                const searchVids = await fetchVideosBySearch();
                results.push(...searchVids);
            }

            refreshActiveChannels();
            for(let c of activeChannels.slice(0, 8)){
                const vids = await fetchChannelVideos(c);
                results.push(...vids);
            }

            if(results.length < 5 && !useFallback) { 
                useFallback = true; 
                return shuffle([...FALLBACK_VIDEOS]); 
            }

            results = shuffle(results);

            results = results.filter(v => { 
                if(seenVideos.has(v.id)) return false; 
                seenVideos.add(v.id); 
                return true; 
            });

            results.sort((a, b) => Math.random() - 0.5);
            
            return results;
        }

        function addToPool(videos){
            videoPool.push(...videos);
            if(videoPool.length > 100) videoPool = videoPool.slice(-100);
        }

        function cleanup(){
            if(videoPool.length > 100) videoPool = videoPool.slice(-100);
            if(seenVideos.size > 2000) seenVideos.clear();
        }

        function addReels(videos){
            videos.forEach(v => {
                const div = document.createElement("div");
                div.className = "reel-item";
                const iframeSrc = `https://www.youtube.com/embed/${v.id}?autoplay=1&mute=0&playsinline=1&rel=0&controls=1&enablejsapi=1`;

                div.innerHTML = `
                    <iframe data-src="${iframeSrc}" data-loaded="false" allow="autoplay; fullscreen"></iframe>
                    
                    <div class="absolute bottom-6 left-4 right-16 z-20 pointer-events-none text-outline flex flex-col gap-2">
                        <div class="flex items-center gap-2">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 to-pink-600 p-[2px]">
                                <div class="w-full h-full bg-black rounded-full flex items-center justify-center border-2 border-transparent">
                                    <i class="fas fa-user text-xs"></i>
                                </div>
                            </div>
                            <b class="text-sm font-bold tracking-wide">${v.channel}</b>
                            <button class="bg-transparent border border-white px-3 py-1 rounded-full text-xs font-semibold ml-2">Follow</button>
                        </div>
                        <p class="text-sm leading-tight text-gray-100 line-clamp-2">${v.title}</p>
                    </div>

                    <div class="absolute bottom-6 right-2 z-20 flex flex-col gap-6 items-center pointer-events-auto">
                        <div class="flex flex-col items-center gap-1 cursor-pointer hover:scale-110 transition-transform">
                            <div class="w-12 h-12 bg-black/40 rounded-full flex items-center justify-center backdrop-blur-sm">
                                <i class="fas fa-heart text-2xl text-white hover:text-red-500 transition-colors"></i>
                            </div>
                            <span class="text-xs font-semibold text-outline">Like</span>
                        </div>
                        <div class="flex flex-col items-center gap-1 cursor-pointer hover:scale-110 transition-transform">
                            <div class="w-12 h-12 bg-black/40 rounded-full flex items-center justify-center backdrop-blur-sm">
                                <i class="fas fa-comment-dots text-2xl"></i>
                            </div>
                            <span class="text-xs font-semibold text-outline">Comment</span>
                        </div>
                        <div class="flex flex-col items-center gap-1 cursor-pointer hover:scale-110 transition-transform">
                            <div class="w-12 h-12 bg-black/40 rounded-full flex items-center justify-center backdrop-blur-sm">
                                <i class="fas fa-share text-2xl"></i>
                            </div>
                            <span class="text-xs font-semibold text-outline">Share</span>
                        </div>
                    </div>
                `;
                feedEl.appendChild(div);
            });
            observeReels();
        }

        let observer;
        function observeReels(){
            if(observer) observer.disconnect();
            const reels = document.querySelectorAll(".reel-item");

            observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    const iframe = entry.target.querySelector("iframe");
                    if(!iframe) return;
                    const isLoaded = iframe.getAttribute("data-loaded") === "true";
                    const originalSrc = iframe.getAttribute("data-src");

                    if(entry.isIntersecting) {
                        if(!isLoaded && originalSrc) {
                            iframe.src = originalSrc;
                            iframe.setAttribute("data-loaded", "true");
                        }
                    } else {
                        if(isLoaded) {
                            iframe.src = "";
                            iframe.setAttribute("data-loaded", "false");
                            setTimeout(() => iframe.setAttribute("data-src", originalSrc), 100);
                        }
                    }
                });
            }, { threshold: 0.6 });

            reels.forEach(r => observer.observe(r));
        }

        async function loadInitial(){
            const vids = await fetchVideos();
            if(vids.length > 0) { addToPool(vids); addReels(vids); }
            setTimeout(() => loadingScreen.classList.add('opacity-0', 'pointer-events-none'), 500);
        }

        async function loadMore(){
            if(loading) return; loading = true;
            const vids = await fetchVideos();
            if(vids.length) { addToPool(vids); addReels(vids); }
            cleanup(); loading = false;
        }

        let scrollLock = false;
        feedEl.addEventListener("scroll", () => {
            if(scrollLock) return; scrollLock = true;
            setTimeout(() => {
                scrollLock = false;
                if(feedEl.scrollTop + feedEl.clientHeight >= feedEl.scrollHeight - (window.innerHeight * 1.5)){
                    loadMore();
                }
            }, 150);
        });

        loadInitial();
        
        setInterval(() => {
            if(!useFallback) { refreshActiveChannels(); loadMore(); }
        }, 180000);

        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("startBtn");
            if(btn) btn.addEventListener("click", () => document.getElementById("soundPrompt")?.remove());
        });
    </script>
</body>
</html>
