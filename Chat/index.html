<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SpaceChat Pro</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="galaxy-bg"></div>

<!-- LOGIN PAGE -->

<div id="authScreen" class="auth-screen">

    <div class="auth-card">

        <div class="logo">
            🌌
        </div>

        <h1>SpaceChat Pro</h1>

        <p>
            Futuristic WhatsApp Style Messenger
        </p>

        <input
        type="email"
        id="email"
        placeholder="Email Address">

        <input
        type="password"
        id="password"
        placeholder="Password">

        <button id="loginBtn" class="primary-btn">
            Login
        </button>

        <button id="signupBtn" class="secondary-btn">
            Create Account
        </button>

        <button id="googleBtn" class="google-btn">
            Continue with Google
        </button>

    </div>

</div>

<!-- CHAT APP -->

<div id="chatScreen" class="chat-app hidden">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="profile">

                <img
                id="userPhoto"
                src="https://ui-avatars.com/api/?name=User">

                <div>

                    <h3 id="userName">
                        User
                    </h3>

                    <p id="userEmail">
                        Email
                    </p>

                </div>

            </div>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

        <div class="search-box">

            <input
            type="text"
            id="searchUser"
            placeholder="Search users...">

        </div>

        <div class="users-title">
            Chats
        </div>

        <div id="usersList" class="users-list">
        </div>

    </aside>

    <!-- CHAT SECTION -->

    <main class="chat-section">

        <div class="chat-header">

            <div class="chat-user">

                <div class="online-dot"></div>

                <div>

                    <h2 id="chatUserName">
                        Select User
                    </h2>

                    <span id="chatStatus">
                        Offline
                    </span>

                </div>

            </div>

        </div>

        <div id="messages" class="messages">

            <div class="empty-chat">

                🌠

                <h2>
                    Welcome To SpaceChat
                </h2>

                <p>
                    Select a user to start chatting
                </p>

            </div>

        </div>

        <div class="message-bar">

            <input
            id="messageInput"
            placeholder="Type a message...">

            <button id="sendBtn">
                ➤
            </button>

        </div>

    </main>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { getFirestore }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAKetSN1IQxYi-nOkD_SZWK7eAxu2_Ku7Q",
  authDomain: "yatharthchat-20b0f.firebaseapp.com",
  projectId: "yatharthchat-20b0f",
  storageBucket: "yatharthchat-20b0f.firebasestorage.app",
  messagingSenderId: "867005975273",
  appId: "1:867005975273:web:137f7d7b151537617c3e78",
  measurementId: "G-76SGKRF2FT"
};

const app = initializeApp(firebaseConfig);

window.auth = getAuth(app);
window.db = getFirestore(app);

</script>

<script type="module" src="app.js"></script>

</body>
</html>
