<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER VAULT | SECURE STORAGE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Courier New', monospace; height: 100vh; overflow-y: auto; }
        #matrixCanvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.15; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,0,0.02) 2px, rgba(0,255,0,0.02) 4px); z-index: 2; pointer-events: none; }
        .main-container { position: relative; z-index: 10; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .terminal { background: rgba(0,0,0,0.92); border: 2px solid #0f0; border-radius: 15px; padding: 30px; width: 95%; max-width: 900px; box-shadow: 0 0 60px rgba(0,255,0,0.3), inset 0 0 60px rgba(0,255,0,0.05); animation: pulse 2s infinite; backdrop-filter: blur(20px); max-height: 90vh; overflow-y: auto; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 30px rgba(0,255,0,0.2),inset 0 0 30px rgba(0,255,0,0.05); } 50% { box-shadow: 0 0 80px rgba(0,255,0,0.4),inset 0 0 80px rgba(0,255,0,0.1); } }
        .glitch-text { color: #0f0; font-size: 26px; font-weight: bold; text-align: center; text-transform: uppercase; animation: glitch 1.5s infinite; text-shadow: 3px 3px #003300; margin-bottom: 20px; }
        @keyframes glitch { 0%,100% { transform: translate(0); } 20% { transform: translate(-3px,2px); } 40% { transform: translate(3px,-2px); } 60% { transform: translate(-2px,-3px); } 80% { transform: translate(2px,3px); } }
        .subtitle { color: #0a0; text-align: center; font-size: 13px; margin: 10px 0 20px; letter-spacing: 3px; }
        .cyber-input { background: rgba(0,25,0,0.7); border: 1px solid #0f0; color: #0f0; padding: 14px; width: 100%; margin: 8px 0; font-family: 'Courier New',monospace; font-size: 15px; border-radius: 8px; outline: none; transition: all 0.3s; letter-spacing: 1px; }
        .cyber-input:focus { box-shadow: 0 0 25px rgba(0,255,0,0.4); background: rgba(0,40,0,0.8); border-color: #0f0; }
        .cyber-input::placeholder { color: rgba(0,255,0,0.3); }
        .cyber-btn { background: rgba(0,25,0,0.8); border: 2px solid #0f0; color: #0f0; padding: 14px 28px; font-family: 'Courier New',monospace; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: all 0.3s; margin: 5px; text-transform: uppercase; letter-spacing: 2px; position: relative; overflow: hidden; }
        .cyber-btn:hover { background: rgba(0,255,0,0.15); box-shadow: 0 0 40px rgba(0,255,0,0.5); transform: translateY(-3px); }
        .cyber-btn:active { transform: translateY(0); }
        .cyber-btn.danger { border-color: #ff0040; color: #ff0040; background: rgba(30,0,0,0.8); }
        .cyber-btn.danger:hover { background: rgba(255,0,0,0.2); box-shadow: 0 0 40px rgba(255,0,0,0.5); }
        .cyber-btn.warning { border-color: #ffaa00; color: #ffaa00; background: rgba(30,20,0,0.8); }
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin: 20px 0; }
        .file-card { background: rgba(0,20,0,0.5); border: 1px solid #0f0; padding: 20px; border-radius: 10px; transition: all 0.3s; cursor: pointer; }
        .file-card:hover { background: rgba(0,255,0,0.1); box-shadow: 0 0 30px rgba(0,255,0,0.3); transform: translateY(-5px); }
        .file-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .file-icon { font-size: 32px; }
        .file-name { color: #0f0; font-weight: bold; font-size: 15px; word-break: break-word; }
        .file-meta { color: rgba(0,255,0,0.5); font-size: 11px; margin-top: 8px; }
        .file-actions { display: flex; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
        .mini-btn { padding: 6px 12px; font-size: 11px; border-radius: 5px; letter-spacing: 1px; }
        .notification { position: fixed; top: 20px; right: 20px; background: rgba(0,20,0,0.95); border: 1px solid #0f0; color: #0f0; padding: 20px 30px; border-radius: 10px; z-index: 1000; animation: slideIn 0.5s, fadeOut 0.5s 3s forwards; backdrop-filter: blur(15px); box-shadow: 0 0 30px rgba(0,255,0,0.3); max-width: 400px; }
        .notification.error { border-color: #ff0040; color: #ff0040; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .spinner { border: 3px solid rgba(0,255,0,0.2); border-top: 3px solid #0f0; border-radius: 50%; width: 50px; height: 50px; animation: spin 0.8s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal-content { background: rgba(0,10,0,0.95); border: 2px solid #0f0; border-radius: 15px; padding: 30px; width: 90%; max-width: 550px; box-shadow: 0 0 60px rgba(0,255,0,0.4); animation: modalIn 0.3s ease-out; max-height: 85vh; overflow-y: auto; }
        @keyframes modalIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .status-bar { color: #0a0; font-size: 11px; text-align: center; margin-top: 20px; letter-spacing: 2px; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        select.cyber-input { appearance: none; cursor: pointer; }
        textarea.cyber-input { resize: vertical; min-height: 80px; }
        ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-track { background: #000; } ::-webkit-scrollbar-thumb { background: #0f0; border-radius: 5px; }
        @media (max-width:768px) { .terminal { padding: 20px; width: 100%; } .glitch-text { font-size: 20px; } .file-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="scanlines"></div>
    <div id="notificationContainer"></div>
    <div class="spinner" id="spinner"></div>
    <div class="main-container">
        <div class="terminal" id="terminal"></div>
    </div>
    <div class="modal-overlay" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        // ==================== FIXED PASSWORDS ====================
        const MASTER_PASSWORD = 'Y@th@Rth';
        const BACKUP_PASSWORD = 'mann';

        // ==================== APP STATE ====================
        const APP = {
            githubToken: '',
            githubUsername: '',
            repoName: '',
            files: [],
            currentFolder: 'root',
            isAdmin: false,
            isLoggedIn: false
        };

        // ==================== HELPERS ====================
        function b64Encode(str) { try { return btoa(unescape(encodeURIComponent(str))); } catch(e) { return btoa(str); } }
        function b64Decode(str) { try { return decodeURIComponent(escape(atob(str))); } catch(e) { return atob(str); } }
        
        function notify(msg, err=false) {
            const c = document.getElementById('notificationContainer');
            const d = document.createElement('div');
            d.className = `notification ${err?'error':''}`;
            d.textContent = msg;
            c.appendChild(d);
            setTimeout(() => d.remove(), 3000);
        }
        
        function spin(show) { document.getElementById('spinner').style.display = show?'block':'none'; }
        
        function openModal(h) {
            document.getElementById('modalContent').innerHTML = h;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        // ==================== MATRIX ====================
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ch = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
        const fs = 16;
        let cols = Math.floor(canvas.width/fs);
        let drops = Array(cols).fill(1);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cols = Math.floor(canvas.width/fs);
            drops = Array(cols).fill(1);
        });
        setInterval(() => {
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = `${fs}px monospace`;
            for(let i=0;i<drops.length;i++) {
                ctx.fillText(ch[Math.floor(Math.random()*ch.length)], i*fs, drops[i]*fs);
                if(drops[i]*fs > canvas.height && Math.random()>0.975) drops[i]=0;
                drops[i]++;
            }
        }, 50);

        // ==================== GITHUB API ====================
        async function gh(endpoint, method='GET', body=null) {
            const url = `https://api.github.com/repos/${APP.githubUsername}/${APP.repoName}${endpoint}`;
            const headers = {
                'Authorization': `token ${APP.githubToken}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            };
            const opts = { method, headers };
            if(body) opts.body = JSON.stringify(body);
            const res = await fetch(url, opts);
            if(!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message||`HTTP ${res.status}`); }
            return res.json();
        }

        // ==================== STORAGE ====================
        async function loadStorage() {
            try {
                const r = await gh('/contents/storage/data.json');
                return JSON.parse(b64Decode(r.content));
            } catch(e) {
                return { files: [] };
            }
        }

        async function saveStorage(data) {
            try {
                const existing = await gh('/contents/storage/data.json').catch(()=>null);
                const body = {
                    message: 'Update vault data',
                    content: b64Encode(JSON.stringify(data, null, 2)),
                    branch: 'main'
                };
                if(existing) body.sha = existing.sha;
                await gh('/contents/storage/data.json', 'PUT', body);
            } catch(e) {
                throw new Error('Save failed: ' + e.message);
            }
        }

        async function loadFiles() {
            const d = await loadStorage();
            APP.files = d.files || [];
        }

        async function saveFiles() {
            const d = await loadStorage();
            d.files = APP.files;
            await saveStorage(d);
        }

        // ==================== SAVE/LOAD API ====================
        function saveAPIToStorage() {
            const data = { token: APP.githubToken, username: APP.githubUsername, repo: APP.repoName };
            localStorage.setItem('vault_api', b64Encode(JSON.stringify(data)));
        }

        function loadAPIFromStorage() {
            const saved = localStorage.getItem('vault_api');
            if(saved) {
                try {
                    const data = JSON.parse(b64Decode(saved));
                    APP.githubToken = data.token;
                    APP.githubUsername = data.username;
                    APP.repoName = data.repo;
                    return true;
                } catch(e) { return false; }
            }
            return false;
        }

        // ==================== RENDER ====================
        function renderLogin() {
            document.getElementById('terminal').innerHTML = `
                <div style="text-align:center;">
                    <h1 class="glitch-text">⚡ CYBER VAULT</h1>
                    <p class="subtitle">[ SECURE STORAGE SYSTEM ]</p>
                    <div style="max-width:400px;margin:30px auto;">
                        <input type="password" id="userPassword" class="cyber-input" placeholder="ENTER PASSWORD" style="text-align:center;">
                        <button class="cyber-btn" onclick="userLogin()" style="width:100%;margin-top:20px;">🔐 ACCESS VAULT</button>
                        <button class="cyber-btn warning" onclick="renderAdminLogin()" style="width:100%;margin-top:10px;font-size:13px;">⚙️ ADMIN PANEL</button>
                    </div>
                    <div class="status-bar">[ MASTER PASSWORD REQUIRED ]</div>
                </div>`;
        }

        function renderAdminLogin() {
            document.getElementById('terminal').innerHTML = `
                <div style="text-align:center;">
                    <h1 class="glitch-text">⚙️ ADMIN SETUP</h1>
                    <p class="subtitle">[ ONE-TIME CONFIGURATION ]</p>
                    <div style="text-align:left;max-width:500px;margin:0 auto;">
                        <label style="color:#0f0;">🔑 GitHub Token</label>
                        <input type="password" id="adminToken" class="cyber-input" placeholder="ghp_xxx">
                        <label style="color:#0f0;">👤 Username</label>
                        <input type="text" id="adminUser" class="cyber-input" placeholder="username">
                        <label style="color:#0f0;">📦 Repository</label>
                        <input type="text" id="adminRepo" class="cyber-input" placeholder="repo-name">
                        <label style="color:#0f0;">🛡️ Backup Password</label>
                        <input type="password" id="adminBackup" class="cyber-input" placeholder="Backup password">
                    </div>
                    <button class="cyber-btn" onclick="adminSetup()" style="width:100%;margin-top:20px;">🚀 SAVE & ACCESS</button>
                    <button class="cyber-btn danger" onclick="renderLogin()" style="width:100%;margin-top:10px;">↩️ BACK</button>
                    <div class="status-bar">[ API DETAILS SAVE HOTE HAIN LOCAL STORAGE MEIN ]</div>
                </div>`;
        }

        function renderDashboard() {
            const currentFiles = APP.files.filter(f => f.folder === APP.currentFolder);
            const folders = [...new Set(APP.files.map(f => f.folder))];
            document.getElementById('terminal').innerHTML = `
                <div>
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
                        <h1 class="glitch-text" style="font-size:22px;margin:0;">📁 ${APP.currentFolder.toUpperCase()}</h1>
                        <span style="color:#0f0;">${currentFiles.length} files</span>
                    </div>
                    <div style="display:flex;gap:8px;margin:20px 0;flex-wrap:wrap;">
                        ${APP.isAdmin ? `
                            <button class="cyber-btn" onclick="showUploadForm()">⬆️ UPLOAD</button>
                            <button class="cyber-btn warning" onclick="showPassManager()">🔑 PASSWORDS</button>
                        ` : ''}
                        ${APP.currentFolder !== 'root' ? `<button class="cyber-btn" onclick="changeFolder('root')">↩️ ROOT</button>` : ''}
                        <button class="cyber-btn danger" onclick="logout()">🚪 ${APP.isAdmin ? 'EXIT' : 'LOCK'}</button>
                    </div>
                    ${folders.length > 1 ? `<div style="margin-bottom:15px;"><span style="color:#0a0;">📁 </span>${folders.filter(f=>f!=='root').map(f=>`<button class="cyber-btn mini-btn" onclick="changeFolder('${f}')">📁 ${f}</button>`).join(' ')}</div>` : ''}
                    <div class="file-grid">
                        ${currentFiles.length === 0 ? `<div style="color:rgba(0,255,0,0.4);text-align:center;grid-column:1/-1;padding:50px;">[ EMPTY ]</div>` :
                            currentFiles.map(f => `
                                <div class="file-card" onclick="${f.hasPassword && !APP.isAdmin ? `promptPass('${f.id}')` : `viewFile('${f.id}')`}">
                                    <div class="file-header">
                                        <span class="file-icon">${f.type==='image'?'🖼️':f.type==='video'?'🎥':'📄'}</span>
                                        ${f.hasPassword ? '<span style="color:#ff0040;">🔒</span>' : '<span style="color:#0f0;">🔓</span>'}
                                    </div>
                                    <div class="file-name">${f.name}</div>
                                    <div class="file-meta">${f.type} | ${f.size||0}KB</div>
                                    ${APP.isAdmin ? `<div class="file-actions">
                                        <button class="cyber-btn mini-btn" onclick="event.stopPropagation();viewFile('${f.id}')">👁️</button>
                                        <button class="cyber-btn warning mini-btn" onclick="event.stopPropagation();changePass('${f.id}')">🔄</button>
                                        <button class="cyber-btn danger mini-btn" onclick="event.stopPropagation();delFile('${f.id}')">🗑️</button>
                                    </div>` : ''}
                                </div>
                            `).join('')
                        }
                    </div>
                    <div class="status-bar">[ ${APP.isAdmin ? 'ADMIN' : 'USER'} MODE ] [ ${APP.githubUsername}/${APP.repoName} ]</div>
                </div>`;
        }

        function showUploadForm() {
            openModal(`
                <h2 class="glitch-text" style="font-size:20px;">⬆️ UPLOAD FILE</h2>
                <label style="color:#0f0;">📁 Folder (empty = root)</label>
                <input type="text" id="ufolder" class="cyber-input" placeholder="e.g. documents">
                <label style="color:#0f0;">📄 File Name</label>
                <input type="text" id="uname" class="cyber-input" placeholder="file-name">
                <label style="color:#0f0;">📂 Type</label>
                <select id="utype" class="cyber-input"><option value="document">📄 Document</option><option value="image">🖼️ Image</option><option value="video">🎥 Video</option></select>
                <label style="color:#0f0;">📝 Content (text ya base64)</label>
                <textarea id="ucontent" class="cyber-input" rows="5" placeholder="Content here..."></textarea>
                <label style="color:#0f0;">🔒 Password (optional)</label>
                <input type="password" id="upass" class="cyber-input" placeholder="File password">
                <button class="cyber-btn" onclick="doUpload()" style="width:100%;margin-top:15px;">🚀 UPLOAD</button>
                <button class="cyber-btn danger" onclick="closeModal()" style="width:100%;">CANCEL</button>`);
        }

        function showPassManager() {
            const locked = APP.files.filter(f => f.hasPassword);
            openModal(`
                <h2 class="glitch-text" style="font-size:20px;">🔑 PASSWORD MANAGER</h2>
                <p style="color:#0f0;">Locked Files: ${locked.length}</p>
                ${locked.map(f => `<div style="background:rgba(0,20,0,0.5);padding:10px;margin:5px 0;border-radius:5px;display:flex;justify-content:space-between;"><span style="color:#0f0;">🔒 ${f.name}</span><button class="cyber-btn mini-btn" onclick="changePass('${f.id}');closeModal();">🔄</button></div>`).join('')}
                <button class="cyber-btn warning" onclick="setAllPass()" style="width:100%;margin:10px 0;">SET ALL PASSWORDS</button>
                <button class="cyber-btn" onclick="remAllPass()" style="width:100%;margin:5px 0;">REMOVE ALL</button>
                <button class="cyber-btn danger" onclick="closeModal()" style="width:100%;margin-top:15px;">CLOSE</button>`);
        }

        // ==================== ACTIONS ====================
        async function userLogin() {
            const pass = document.getElementById('userPassword').value;
            if(pass !== MASTER_PASSWORD) { notify('❌ WRONG PASSWORD!', true); return; }
            
            // Check if API is configured
            if(!loadAPIFromStorage()) {
                notify('⚠️ Admin setup needed first! Use ⚙️ ADMIN PANEL button', true);
                return;
            }

            spin(true);
            try {
                await loadFiles();
                APP.isLoggedIn = true;
                APP.isAdmin = false;
                spin(false);
                notify('✅ ACCESS GRANTED');
                renderDashboard();
            } catch(e) {
                spin(false);
                notify('❌ Failed to load: ' + e.message, true);
            }
        }

        async function adminSetup() {
            const token = document.getElementById('adminToken').value.trim();
            const user = document.getElementById('adminUser').value.trim();
            const repo = document.getElementById('adminRepo').value.trim();
            const backup = document.getElementById('adminBackup').value;

            if(!token || !user || !repo || !backup) { notify('❌ All fields required!', true); return; }
            if(backup !== BACKUP_PASSWORD) { notify('❌ Wrong backup password!', true); return; }

            APP.githubToken = token;
            APP.githubUsername = user;
            APP.repoName = repo;

            spin(true);
            try {
                await gh('/contents');
                await loadFiles();
                saveAPIToStorage(); // ← YAHAN SAVE HO RAHA HAI!
                APP.isLoggedIn = true;
                APP.isAdmin = true;
                spin(false);
                notify('✅ Admin setup complete! API saved locally.');
                renderDashboard();
            } catch(e) {
                spin(false);
                notify('❌ Failed: ' + e.message, true);
            }
        }

        async function doUpload() {
            const folder = document.getElementById('ufolder').value.trim() || 'root';
            const name = document.getElementById('uname').value.trim();
            const type = document.getElementById('utype').value;
            const content = document.getElementById('ucontent').value;
            const pass = document.getElementById('upass').value;

            if(!name || !content) { notify('❌ Name & content required!', true); return; }

            spin(true);
            try {
                const fileData = {
                    id: Date.now().toString(),
                    name, type,
                    folder,
                    password: pass ? b64Encode(pass) : '',
                    hasPassword: !!pass,
                    content: b64Encode(content),
                    size: Math.round(content.length * 0.75 / 1024),
                    createdAt: new Date().toISOString()
                };
                APP.files.push(fileData);
                await saveFiles();
                spin(false);
                closeModal();
                notify('✅ File uploaded!');
                renderDashboard();
            } catch(e) {
                spin(false);
                notify('❌ ' + e.message, true);
            }
        }

        function viewFile(fileId) {
            const f = APP.files.find(x => x.id === fileId);
            if(!f) return;
            const content = f.content ? b64Decode(f.content) : '';
            openModal(`
                <h2 class="glitch-text" style="font-size:18px;">📄 ${f.name}</h2>
                <div style="color:#0a0;font-size:12px;">${f.type} | ${f.size}KB | ${new Date(f.createdAt).toLocaleString()}</div>
                <div style="max-height:55vh;overflow-y:auto;margin:15px 0;background:rgba(0,20,0,0.5);padding:15px;border-radius:8px;border:1px solid #0f0;">
                    ${f.type==='image'?`<img src="${content}" style="max-width:100%;">`:f.type==='video'?`<video controls style="max-width:100%;"><source src="${content}"></video>`:`<pre style="color:#0f0;white-space:pre-wrap;">${content}</pre>`}
                </div>
                <button class="cyber-btn" onclick="closeModal()" style="width:100%;">CLOSE</button>`);
        }

        function promptPass(fileId) {
            const pass = prompt('🔒 Enter file password:');
            if(pass) {
                const f = APP.files.find(x => x.id === fileId);
                if(f && b64Decode(f.password) === pass) {
                    viewFile(fileId);
                } else {
                    notify('❌ Wrong password!', true);
                }
            }
        }

        async function changePass(fileId) {
            const backup = prompt('Enter BACKUP PASSWORD to change:');
            if(backup !== BACKUP_PASSWORD) { notify('❌ Wrong backup password!', true); return; }
            const newPass = prompt('New password (empty to remove):');
            const f = APP.files.find(x => x.id === fileId);
            if(f) {
                f.password = newPass ? b64Encode(newPass) : '';
                f.hasPassword = !!newPass;
                await saveFiles();
                notify(newPass ? '🔒 Updated!' : '🔓 Removed!');
                renderDashboard();
            }
        }

        async function delFile(fileId) {
            if(confirm('Delete?')) {
                APP.files = APP.files.filter(f => f.id !== fileId);
                await saveFiles();
                notify('🗑️ Deleted!');
                renderDashboard();
            }
        }

        async function setAllPass() {
            const pass = prompt('Password for ALL files:');
            if(pass) {
                APP.files.forEach(f => { f.password = b64Encode(pass); f.hasPassword = true; });
                await saveFiles();
                notify('🔒 All locked!');
                renderDashboard();
            }
        }

        async function remAllPass() {
            if(confirm('Remove ALL passwords?')) {
                APP.files.forEach(f => { f.password = ''; f.hasPassword = false; });
                await saveFiles();
                notify('🔓 All unlocked!');
                renderDashboard();
            }
        }

        function changeFolder(folder) {
            APP.currentFolder = folder;
            renderDashboard();
        }

        function logout() {
            APP.isLoggedIn = false;
            APP.isAdmin = false;
            APP.files = [];
            APP.currentFolder = 'root';
            renderLogin();
        }

        // ==================== INIT ====================
        document.addEventListener('keypress', e => {
            if(e.key === 'Enter') {
                const inp = document.getElementById('userPassword');
                if(inp && document.activeElement === inp) userLogin();
            }
        });
        document.getElementById('modal').addEventListener('click', function(e) {
            if(e.target === this) closeModal();
        });

        renderLogin();
    </script>
</body>
</html>
