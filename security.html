<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YATHARTH CYBER SECURITY | MULTI-TOOL SUITE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;font-family:'Courier New',monospace;height:100vh;overflow:hidden;cursor:crosshair}
        #matrixCanvas{position:fixed;top:0;left:0;z-index:0;opacity:.15}
        #binaryCanvas{position:fixed;top:0;left:0;z-index:1;opacity:.1}
        #particleCanvas{position:fixed;top:0;left:0;z-index:1;opacity:.7}
        .scanlines{position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,.02) 2px,rgba(0,255,0,.02) 4px);z-index:2;pointer-events:none;animation:scan 8s linear infinite}
        @keyframes scan{0%{background-position:0 0}100%{background-position:0 100px}}
        .crt{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none;animation:flicker .15s infinite}
        @keyframes flicker{0%{background:transparent}50%{background:rgba(0,0,0,.02)}100%{background:transparent}}
        .red-alert{position:fixed;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;background:transparent;transition:.1s}
        .red-alert.active{background:rgba(255,0,0,.25);animation:alertFl .5s 3}
        @keyframes alertFl{0%,100%{background:transparent}50%{background:rgba(255,0,0,.35)}}
        .boot{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999;display:flex;align-items:center;justify-content:center;animation:fadeBoot .5s 2s forwards}
        .boot-txt{color:#0f0;font-family:'Courier New',monospace;font-size:14px;line-height:1.8}
        @keyframes fadeBoot{to{opacity:0;pointer-events:none}}

        /* MAIN APP LAYOUT */
        .app{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column}
        .header{background:rgba(0,0,0,.93);border-bottom:1px solid #0f0;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 0 30px rgba(0,255,0,.2)}
        .logo{color:#0f0;font-size:20px;font-weight:bold;animation:glitch 1.5s infinite;letter-spacing:3px}
        @keyframes glitch{0%,100%{transform:translate(0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,-2px)}80%{transform:translate(1px,2px)}}
        .header-actions{display:flex;gap:8px;flex-wrap:wrap}
        .icon-btn{background:rgba(0,30,0,.6);border:1px solid #0f0;color:#0f0;padding:8px 15px;font-family:'Courier New',monospace;cursor:pointer;border-radius:5px;font-size:12px;transition:.3s;letter-spacing:1px}
        .icon-btn:hover{background:rgba(0,255,0,.15);box-shadow:0 0 25px rgba(0,255,0,.5);transform:translateY(-2px)}
        .icon-btn.danger{border-color:#ff0040;color:#ff0040}
        .icon-btn.danger:hover{box-shadow:0 0 25px rgba(255,0,0,.5);background:rgba(255,0,0,.15)}
        .icon-btn.warning{border-color:#ffaa00;color:#ffaa00}

        /* MAIN CONTENT */
        .content{flex:1;overflow-y:auto;padding:20px}
        .content::-webkit-scrollbar{width:8px}
        .content::-webkit-scrollbar-track{background:#000}
        .content::-webkit-scrollbar-thumb{background:#0f0;border-radius:4px}

        /* TOOL GRID */
        .tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px;margin-bottom:25px}
        .tool-card{background:rgba(0,20,0,.5);border:1px solid rgba(0,255,0,.3);border-radius:12px;padding:25px;cursor:pointer;transition:.3s;position:relative;overflow:hidden;text-align:center}
        .tool-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,255,0,.05),transparent);transition:.5s}
        .tool-card:hover::before{left:100%}
        .tool-card:hover{background:rgba(0,255,0,.08);box-shadow:0 0 45px rgba(0,255,0,.4);transform:translateY(-6px);border-color:#0f0}
        .tool-icon{font-size:50px;margin-bottom:12px;filter:drop-shadow(0 0 15px rgba(0,255,0,.4))}
        .tool-name{color:#0f0;font-size:16px;font-weight:bold;margin-bottom:5px;letter-spacing:2px}
        .tool-desc{color:rgba(0,255,0,.4);font-size:11px}
        .tool-card.file-vault{border-color:#00ff88}
        .tool-card.pdf-suite{border-color:#ff0040}
        .tool-card.image-tools{border-color:#ffaa00}
        .tool-card.text-editor{border-color:#00aaff}
        .tool-card.encryption{border-color:#ff00ff}
        .tool-card.admin-panel{border-color:#ffaa00}
        .tool-card.hash-tool{border-color:#00ffcc}
        .tool-card.pass-gen{border-color:#ff66ff}
        .tool-card.big-upload{border-color:#00ffff}
        .progress-wrap{background:rgba(0,30,0,.5);border:1px solid #0f0;border-radius:6px;height:22px;margin:12px 0 4px;overflow:hidden}
        .progress-bar{background:#0f0;height:100%;width:0%;transition:.2s}

        /* RECENT FILES */
        .section-title{color:#0f0;font-size:16px;margin-bottom:15px;letter-spacing:3px;border-bottom:1px solid rgba(0,255,0,.2);padding-bottom:8px}
        .recent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
        .recent-card{background:rgba(0,15,0,.4);border:1px solid rgba(0,255,0,.2);padding:12px 15px;border-radius:8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.3s}
        .recent-card:hover{background:rgba(0,255,0,.08);border-color:#0f0;box-shadow:0 0 20px rgba(0,255,0,.3)}
        .recent-icon{font-size:22px}
        .recent-info{flex:1}
        .recent-name{color:#0f0;font-size:13px;font-weight:bold}
        .recent-meta{color:rgba(0,255,0,.4);font-size:10px;margin-top:3px}

        /* MODAL */
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.93);display:none;justify-content:center;align-items:center;z-index:100;backdrop-filter:blur(10px)}
        .modal-box{background:rgba(0,8,0,.97);border:2px solid #0f0;border-radius:15px;padding:30px;width:95%;max-width:650px;box-shadow:0 0 80px rgba(0,255,0,.4),inset 0 0 40px rgba(0,255,0,.03);animation:modIn .3s ease-out;max-height:85vh;overflow-y:auto}
        @keyframes modIn{from{transform:scale(.7) rotateY(10deg);opacity:0}to{transform:scale(1) rotateY(0);opacity:1}}
        .cyber-input{background:rgba(0,30,0,.6);border:1px solid #0f0;color:#0f0;padding:12px;width:100%;margin:6px 0;font-family:'Courier New',monospace;font-size:14px;border-radius:6px;outline:none;transition:.3s;letter-spacing:1px}
        .cyber-input:focus{box-shadow:0 0 25px rgba(0,255,0,.5);background:rgba(0,50,0,.8)}
        .cyber-btn{background:rgba(0,25,0,.7);border:2px solid #0f0;color:#0f0;padding:12px 25px;font-family:'Courier New',monospace;font-weight:bold;cursor:pointer;border-radius:6px;transition:.3s;margin:4px;text-transform:uppercase;letter-spacing:2px}
        .cyber-btn:hover{background:rgba(0,255,0,.15);box-shadow:0 0 40px rgba(0,255,0,.5);transform:translateY(-3px)}
        .cyber-btn.danger{border-color:#ff0040;color:#ff0040;background:rgba(25,0,0,.7)}
        .cyber-btn.danger:hover{box-shadow:0 0 40px rgba(255,0,0,.5)}
        .cyber-btn.warning{border-color:#ffaa00;color:#ffaa00}
        .cyber-btn.success{border-color:#00ff88;color:#00ff88}
        .spinner{border:3px solid rgba(0,255,0,.1);border-top:3px solid #0f0;border-radius:50%;width:45px;height:45px;animation:spin .6s linear infinite;margin:20px auto;display:none;box-shadow:0 0 25px rgba(0,255,0,.3)}
        @keyframes spin{to{transform:rotate(360deg)}}
        .notify{position:fixed;top:20px;right:20px;background:rgba(0,20,0,.95);border:1px solid #0f0;color:#0f0;padding:15px 25px;border-radius:8px;z-index:1000;animation:slideIn .5s,fadeOut .5s 3s forwards;box-shadow:0 0 35px rgba(0,255,0,.3);max-width:350px;font-size:13px}
        .notify.err{border-color:#ff0040;color:#ff0040}
        @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes fadeOut{from{opacity:1}to{opacity:0}}
        textarea.cyber-input{resize:vertical;min-height:100px}
        select.cyber-input{appearance:none;cursor:pointer}
        .field-label{color:#0a0;font-size:12px;display:block;margin-top:8px}
        @media(max-width:768px){.tool-grid{grid-template-columns:repeat(2,1fr)}.header{padding:10px}.logo{font-size:16px}.tool-card{padding:20px}.tool-icon{font-size:35px}}
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <canvas id="binaryCanvas"></canvas>
    <canvas id="particleCanvas"></canvas>
    <div class="scanlines"></div>
    <div class="crt"></div>
    <div class="red-alert" id="redAlert"></div>
    <div class="boot" id="bootScreen"><div class="boot-txt" id="bootText"></div></div>
    <div id="notifyContainer"></div>
    <div class="spinner" id="spinner"></div>

    <!-- MAIN APP -->
    <div class="app" id="mainApp" style="display:none;">
        <div class="header">
            <span class="logo">⚡ YATHARTH CYBER SECURITY</span>
            <div class="header-actions">
                <button class="icon-btn" onclick="refreshFiles()">🔄 SYNC</button>
                <button class="icon-btn" onclick="showAdminSetup()">⚙️ ADMIN</button>
                <button class="icon-btn danger" onclick="resetSession()">🔄 RESET</button>
            </div>
        </div>
        <div class="content" id="mainContent"></div>
    </div>

    <div class="modal" id="modal"><div class="modal-box" id="modalContent"></div></div>

    <script>
        // ==================== CONFIG ====================
        const BACKUP_PASS = 'mann';
        const APP = { token:'', user:'', repo:'', files:[], folder:'root', admin:false };

        function b64e(s){try{return btoa(unescape(encodeURIComponent(s)))}catch(e){return btoa(s)}}
        function b64d(s){try{return decodeURIComponent(escape(atob(s)))}catch(e){return atob(s)}}
        function notify(m,e){const c=document.getElementById('notifyContainer');const d=document.createElement('div');d.className=`notify ${e?'err':''}`;d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),3500);if(e){const a=document.getElementById('redAlert');a.classList.add('active');setTimeout(()=>a.classList.remove('active'),1500)}}
        function spin(s){document.getElementById('spinner').style.display=s?'block':'none'}
        function openModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').style.display='flex'}
        function closeModal(){document.getElementById('modal').style.display='none'}

        // Boot -> straight into the app, no password gate
        (function(){
            const l=['[BOOT] YATHARTH CYBER SECURITY...','[OK] Kernel v8.1','[OK] AES-256-GCM Engine','[OK] Matrix Engine','[OK] Multi-Tool Framework','[OK] GitHub Bridge','[READY]'];
            const e=document.getElementById('bootText');let i=0;
            function t(){if(i<l.length){e.innerHTML+=l[i]+'<br>';i++;setTimeout(t,Math.random()*180+80)}}
            t();
            setTimeout(()=>{
                document.getElementById('bootScreen').style.display='none';
                document.getElementById('mainApp').style.display='flex';
                loadAPI();
                renderDashboard();
                if(APP.token)refreshFiles();
            },2200);
        })();

        // Matrix
        const mc=document.getElementById('matrixCanvas'),mctx=mc.getContext('2d');
        mc.width=window.innerWidth;mc.height=window.innerHeight;
        const ch='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*{}[]|/\\<>',fs=16;
        let cols=Math.floor(mc.width/fs),drops=Array(cols).fill(1);
        function dm(){mctx.fillStyle='rgba(0,0,0,.05)';mctx.fillRect(0,0,mc.width,mc.height);mctx.fillStyle='#0f0';mctx.font=`${fs}px monospace`;for(let i=0;i<drops.length;i++){mctx.fillText(ch[Math.floor(Math.random()*ch.length)],i*fs,drops[i]*fs);if(drops[i]*fs>mc.height&&Math.random()>.975)drops[i]=0;drops[i]++}}
        setInterval(dm,45);

        // Binary
        const bc=document.getElementById('binaryCanvas'),bctx=bc.getContext('2d');
        bc.width=window.innerWidth;bc.height=window.innerHeight;
        const bfs=20;let bcols=Math.floor(bc.width/bfs),bdrops=Array(bcols).fill(1);
        function db(){bctx.fillStyle='rgba(0,0,0,.03)';bctx.fillRect(0,0,bc.width,bc.height);bctx.fillStyle='rgba(0,255,0,.25)';bctx.font=`${bfs}px monospace`;for(let i=0;i<bdrops.length;i++){bctx.fillText(Math.random()>.5?'0':'1',i*bfs,bdrops[i]*bfs);if(bdrops[i]*bfs>bc.height&&Math.random()>.99)bdrops[i]=0;bdrops[i]++}}
        setInterval(db,80);

        // Particles
        const pc=document.getElementById('particleCanvas'),pctx=pc.getContext('2d');
        pc.width=window.innerWidth;pc.height=window.innerHeight;
        const parts=Array.from({length:40},()=>({x:Math.random()*pc.width,y:Math.random()*pc.height,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,s:Math.random()*2+.5,a:Math.random()*.4+.1}));
        function dp(){pctx.clearRect(0,0,pc.width,pc.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>pc.width)p.vx*=-1;if(p.y<0||p.y>pc.height)p.vy*=-1;pctx.fillStyle=`rgba(0,255,0,${p.a})`;pctx.shadowBlur=8;pctx.shadowColor='#0f0';pctx.beginPath();pctx.arc(p.x,p.y,p.s,0,Math.PI*2);pctx.fill();pctx.shadowBlur=0});requestAnimationFrame(dp)}
        dp();
        window.addEventListener('resize',()=>{mc.width=bc.width=pc.width=window.innerWidth;mc.height=bc.height=pc.height=window.innerHeight;cols=Math.floor(mc.width/fs);drops=Array(cols).fill(1);bcols=Math.floor(bc.width/bfs);bdrops=Array(bcols).fill(1)});

        // GitHub API
        async function gh(e,m='GET',b=null){if(!APP.token||!APP.user||!APP.repo)throw new Error('API not configured');const u=`https://api.github.com/repos/${APP.user}/${APP.repo}${e}`;const h={'Authorization':`token ${APP.token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};const o={method:m,headers:h};if(b)o.body=JSON.stringify(b);const r=await fetch(u,o);if(!r.ok)throw new Error('API Error');return r.json()}
        async function loadStore(){try{const r=await gh('/contents/storage/data.json');return JSON.parse(b64d(r.content))}catch(e){return{files:[]}}}
        async function saveStore(d){try{const ex=await gh('/contents/storage/data.json').catch(()=>null);const bd={message:'Update vault',content:b64e(JSON.stringify(d,null,2)),branch:APP.branch||'main'};if(ex)bd.sha=ex.sha;await gh('/contents/storage/data.json','PUT',bd)}catch(e){throw new Error('Save failed')}}
        async function loadFiles(){const d=await loadStore();APP.files=d.files||[]}
        async function saveFiles(){const d=await loadStore();d.files=APP.files;await saveStore(d)}
        function saveAPI(){localStorage.setItem('vault_api',b64e(JSON.stringify({token:APP.token,username:APP.user,repo:APP.repo,branch:APP.branch})))}
        function loadAPI(){const s=localStorage.getItem('vault_api');if(s){try{const d=JSON.parse(b64d(s));APP.token=d.token;APP.user=d.username;APP.repo=d.repo;APP.branch=d.branch||'main';APP.admin=!!d.token;return true}catch(e){return false}}return false}

        function resetSession(){
            APP.token='';APP.user='';APP.repo='';APP.branch='';APP.files=[];APP.folder='root';APP.admin=false;
            localStorage.removeItem('vault_api');
            renderDashboard();
            notify('🔄 SESSION RESET');
        }

        // ==================== DASHBOARD ====================
        function renderDashboard(){
            const recent=APP.files.slice(-6).reverse();
            document.getElementById('mainContent').innerHTML=`
                <div class="tool-grid">
                    <div class="tool-card file-vault" onclick="openFileManager()">
                        <div class="tool-icon">📁</div>
                        <div class="tool-name">FILE VAULT</div>
                        <div class="tool-desc">Secure File Storage</div>
                    </div>
                    <div class="tool-card pdf-suite" onclick="openPDFSuite()">
                        <div class="tool-icon">📕</div>
                        <div class="tool-name">PDF SUITE</div>
                        <div class="tool-desc">Merge • Split • Convert</div>
                    </div>
                    <div class="tool-card image-tools" onclick="openImageTools()">
                        <div class="tool-icon">🖼️</div>
                        <div class="tool-name">IMAGE TOOLS</div>
                        <div class="tool-desc">View • Compress • Convert</div>
                    </div>
                    <div class="tool-card text-editor" onclick="openTextEditor()">
                        <div class="tool-icon">📝</div>
                        <div class="tool-name">TEXT EDITOR</div>
                        <div class="tool-desc">Create & Edit Notes</div>
                    </div>
                    <div class="tool-card encryption" onclick="openEncryption()">
                        <div class="tool-icon">🔐</div>
                        <div class="tool-name">ENCRYPTION</div>
                        <div class="tool-desc">Real AES-256-GCM</div>
                    </div>
                    <div class="tool-card hash-tool" onclick="openHashTool()">
                        <div class="tool-icon">🔢</div>
                        <div class="tool-name">HASH GENERATOR</div>
                        <div class="tool-desc">SHA-256 / SHA-1 / SHA-512</div>
                    </div>
                    <div class="tool-card pass-gen" onclick="openPassGen()">
                        <div class="tool-icon">🔑</div>
                        <div class="tool-name">PASSWORD GENERATOR</div>
                        <div class="tool-desc">Secure Random Passwords</div>
                    </div>
                    <div class="tool-card big-upload" onclick="openBigUpload()">
                        <div class="tool-icon">📦</div>
                        <div class="tool-name">BIG FILE UPLOAD</div>
                        <div class="tool-desc">Up to 2GB • Free (GitHub Releases)</div>
                    </div>
                    <div class="tool-card admin-panel" onclick="showAdminSetup()">
                        <div class="tool-icon">⚙️</div>
                        <div class="tool-name">ADMIN PANEL</div>
                        <div class="tool-desc">Upload & Manage</div>
                    </div>
                </div>
                ${recent.length>0?`
                <div class="section-title">📄 RECENT FILES</div>
                <div class="recent-grid">
                    ${recent.map(f=>`
                        <div class="recent-card" onclick="openRecentFile('${f.id}')">
                            <span class="recent-icon">${f.type==='image'?'🖼️':f.type==='video'?'🎥':f.type==='large-file'?'📦':'📄'}</span>
                            <div class="recent-info">
                                <div class="recent-name">${f.name}</div>
                                <div class="recent-meta">${f.type} • ${f.size||0}KB ${f.hasPassword?'🔒':'🔓'}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>`:`<div style="color:rgba(0,255,0,.3);text-align:center;padding:40px;">[ NO FILES IN VAULT ]</div>`}
                <div style="text-align:center;margin-top:25px;color:#0a0;font-size:10px;letter-spacing:3px;">[ YATHARTH CYBER SECURITY ] [ MULTI-TOOL SUITE ] [ SECURE CONNECTION ]</div>
            `;
        }

        async function refreshFiles(){
            if(!APP.token){notify('⚠️ Admin setup required',true);return}
            spin(true);
            try{await loadFiles();spin(false);renderDashboard();notify('🔄 Files synced')}catch(e){spin(false);notify('❌ Sync failed',true)}
        }

        function openRecentFile(id){
            if(!APP.token){notify('⚠️ Admin setup required',true);return}
            const f=APP.files.find(x=>x.id===id);
            if(!f)return;
            if(f.type==='large-file'){
                openModal(`
                    <h2 style="color:#00ffff;font-size:18px;">📦 ${f.name}</h2>
                    <div style="color:#0a0;font-size:11px;">${(f.size/1024).toFixed(2)}MB ${f.hasPassword?'🔒 Password Protected':'🔓'}</div>
                    <div id="dlProgressText" style="color:#0a0;font-size:11px;margin-top:10px;"></div>
                    <div style="display:flex;gap:10px;margin-top:15px;">
                        <button class="cyber-btn success" onclick="downloadLargeFile('${f.id}')" style="flex:1;">⬇️ DOWNLOAD</button>
                        <button class="cyber-btn danger" onclick="deleteLargeFile('${f.id}')" style="flex:1;">🗑️ DELETE</button>
                    </div>
                    <button class="cyber-btn" onclick="closeModal()" style="width:100%;margin-top:10px;">CLOSE</button>
                `);
                return;
            }
            if(f.hasPassword){const p=prompt('🔒 File password:');if(!p||b64d(f.password)!==p){notify('⛔ Wrong!',true);return}}
            const c=f.content?b64d(f.content):'';
            openModal(`<h2 style="color:#0f0;font-size:18px;">📄 ${f.name}</h2><div style="color:#0a0;font-size:11px;">${f.type} | ${f.size}KB</div><div style="max-height:50vh;overflow-y:auto;margin:15px 0;background:rgba(0,20,0,.5);padding:15px;border-radius:8px;border:1px solid #0f0;">${f.type==='image'?`<img src="${c}" style="max-width:100%;">`:f.type==='video'?`<video controls style="max-width:100%;"><source src="${c}"></video>`:`<pre style="color:#0f0;white-space:pre-wrap;">${c}</pre>`}</div><button class="cyber-btn" onclick="closeModal()" style="width:100%;">CLOSE</button>`);
        }

        // ==================== TOOLS ====================
        function openFileManager(){
            if(!APP.token){notify('⚠️ Admin setup required',true);return}
            const current=APP.files.filter(f=>f.folder===APP.folder);
            const folders=[...new Set(APP.files.map(f=>f.folder))];
            openModal(`
                <h2 style="color:#0f0;font-size:20px;">📁 FILE VAULT // ${APP.folder.toUpperCase()}</h2>
                <div style="display:flex;gap:8px;margin:15px 0;flex-wrap:wrap;">
                    ${APP.admin?`<button class="cyber-btn" onclick="showUploadForm();closeModal();">⬆️ UPLOAD</button>`:''}
                    ${APP.folder!=='root'?`<button class="cyber-btn" onclick="APP.folder='root';closeModal();openFileManager();">↩️ ROOT</button>`:''}
                </div>
                ${folders.length>1?`<div style="margin:10px 0;">${folders.filter(f=>f!=='root').map(f=>`<button class="cyber-btn" style="font-size:11px;padding:6px 12px;" onclick="APP.folder='${f}';closeModal();openFileManager();">📁 ${f}</button>`).join(' ')}</div>`:''}
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;">
                    ${current.length===0?'<div style="color:rgba(0,255,0,.3);text-align:center;grid-column:1/-1;padding:40px;">[ EMPTY ]</div>':current.map(f=>`

        // ==================== REAL ENCRYPTION (AES-256-GCM via Web Crypto API) ====================
        function openEncryption(){
            openModal(`
                <h2 style="color:#ff00ff;font-size:20px;">🔐 ENCRYPTION LAB</h2>
                <p style="color:#0a0;font-size:11px;">Real AES-256-GCM encryption, key derived with PBKDF2 (100k iterations). Runs 100% in your browser — nothing is sent anywhere.</p>
                <span class="field-label">Text</span>
                <textarea id="encText" class="cyber-input" rows="5" placeholder="Enter plain text to encrypt, or paste ciphertext to decrypt..."></textarea>
                <span class="field-label">Password / Key</span>
                <input type="password" id="encKey" class="cyber-input" placeholder="Encryption key">
                <div style="display:flex;gap:10px;margin-top:10px;">
                    <button class="cyber-btn success" onclick="encryptText()">🔒 ENCRYPT</button>
                    <button class="cyber-btn warning" onclick="decryptText()">🔓 DECRYPT</button>
                </div>
                <span class="field-label">Result</span>
                <textarea id="encResult" class="cyber-input" rows="5" placeholder="Result..." readonly></textarea>
                <button class="cyber-btn" onclick="navigator.clipboard.writeText(document.getElementById('encResult').value);notify('📋 Copied!')" style="width:100%;">📋 COPY RESULT</button>
                <button class="cyber-btn danger" onclick="closeModal()" style="width:100%;margin-top:10px;">CLOSE</button>
            `);
        }

        async function deriveAesKey(password, salt){
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                {name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'},
                keyMaterial,
                {name:'AES-GCM', length:256},
                false,
                ['encrypt','decrypt']
            );
        }

        async function encryptText(){
            const text=document.getElementById('encText').value;
            const pass=document.getElementById('encKey').value;
            if(!text||!pass){notify('❌ Text & key required',true);return}
            try{
                const enc=new TextEncoder();
                const salt=crypto.getRandomValues(new Uint8Array(16));
                const iv=crypto.getRandomValues(new Uint8Array(12));
                const key=await deriveAesKey(pass,salt);
                const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(text));
                const combined=new Uint8Array(salt.length+iv.length+ct.byteLength);
                combined.set(salt,0);combined.set(iv,salt.length);combined.set(new Uint8Array(ct),salt.length+iv.length);
                let bin='';combined.forEach(b=>bin+=String.fromCharCode(b));
                document.getElementById('encResult').value=btoa(bin);
                notify('🔒 Encrypted with AES-256-GCM!');
            }catch(e){notify('❌ Encryption failed',true)}
        }

        async function decryptText(){
            const src=(document.getElementById('encResult').value||document.getElementById('encText').value).trim();
            const pass=document.getElementById('encKey').value;
            if(!src||!pass){notify('❌ Ciphertext & key required',true);return}
            try{
                const bin=atob(src);
                const raw=new Uint8Array(bin.length);
                for(let i=0;i<bin.length;i++)raw[i]=bin.charCodeAt(i);
                const salt=raw.slice(0,16);
                const iv=raw.slice(16,28);
                const data=raw.slice(28);
                const key=await deriveAesKey(pass,salt);
                const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
                document.getElementById('encResult').value=new TextDecoder().decode(pt);
                notify('🔓 Decrypted!');
            }catch(e){notify('❌ Wrong key or invalid ciphertext',true)}
        }

        async function generateHash(){
            const text=document.getElementById('hashInput').value;
            const algo=document.getElementById('hashAlgo').value;
            if(!text){notify('❌ Enter text first',true);return}
            try{
                const enc=new TextEncoder().encode(text);
                const buf=await crypto.subtle.digest(algo,enc);
                const hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
                document.getElementById('hashResult').value=hex;
                notify('✅ Hash generated');
            }catch(e){notify('❌ Hash failed',true)}
        }

        function generatePassword(){
            const len=parseInt(document.getElementById('pgLen').value);
            const useSym=document.getElementById('pgSymbols').checked;
            const useNum=document.getElementById('pgNumbers').checked;
            let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            if(useNum)chars+='0123456789';
            if(useSym)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
            const arr=new Uint32Array(len);
            crypto.getRandomValues(arr);
            let pass='';
            for(let i=0;i<len;i++)pass+=chars[arr[i]%chars.length];
            document.getElementById('pgResult').value=pass;
            notify('🔑 Password generated');
        }

        // ==================== BIG FILE UPLOAD (GitHub Releases — free, up to 2GB per file) ====================
        const RELEASE_TAG='vault-storage';
        let cachedReleaseId=null;

        async function getOrCreateRelease(){
            if(cachedReleaseId)return cachedReleaseId;
            try{
                const d=await gh(`/releases/tags/${RELEASE_TAG}`);
                cachedReleaseId=d.id;
            }catch(e){
                const d=await gh('/releases','POST',{tag_name:RELEASE_TAG,name:'Vault Storage (auto-managed, do not delete)',body:'Large files stored by Yatharth Cyber Security. Do not delete this release manually.',draft:false,prerelease:true});
                cachedReleaseId=d.id;
            }
            return cachedReleaseId;
        }

        function uploadAssetXHR(file,releaseId,onProgress){
            return new Promise((resolve,reject)=>{
                const safeName=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
                const url=`https://uploads.github.com/repos/${APP.user}/${APP.repo}/releases/${releaseId}/assets?name=${encodeURIComponent(safeName)}`;
                const xhr=new XMLHttpRequest();
                xhr.open('POST',url);
                xhr.setRequestHeader('Authorization',`token ${APP.token}`);
                xhr.setRequestHeader('Content-Type',file.type||'application/octet-stream');
                xhr.upload.onprogress=(e)=>{if(e.lengthComputable&&onProgress)onProgress(Math.round(e.loaded/e.total*100))};
                xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300){resolve(JSON.parse(xhr.responseText))}else{reject(new Error('Upload failed ('+xhr.status+')'))}};
                xhr.onerror=()=>reject(new Error('Network error during upload'));
                xhr.send(file);
            });
        }

            openModal(`

        async function startBigUpload(){
            const fileInput=document.getElementById('bigFileInput');
            const file=fileInput.files[0];
            if(!file){notify('❌ Select a file first',true);return}
            if(file.size>2*1024*1024*1024){notify('❌ Max 2GB per file (GitHub limit)',true);return}
            const folder=document.getElementById('bigFileFolder').value.trim()||'root';
            const pass=document.getElementById('bigFilePass').value;
            const bar=document.getElementById('uploadProgressBar');
            const txt=document.getElementById('uploadProgressText');
            const btn=document.getElementById('bigUploadBtn');
            btn.disabled=true;
            try{
                const releaseId=await getOrCreateRelease();
                const asset=await uploadAssetXHR(file,releaseId,(pct)=>{bar.style.width=pct+'%';txt.textContent=pct+'% uploaded ('+(file.size/1024/1024).toFixed(1)+'MB total)'});
                APP.files.push({
                    id:Date.now().toString(),
                    name:file.name,
                    type:'large-file',
                    folder:folder,
                    assetId:asset.id,
                    releaseId:releaseId,
                    downloadApiUrl:asset.url,
                    size:file.size/1024,
                    hasPassword:!!pass,
                    password:pass?b64e(pass):'',
                    createdAt:new Date().toISOString()
                });
                await saveFiles();
                notify('✅ Large file uploaded!');
                closeModal();renderDashboard();
            }catch(e){notify('❌ '+e.message,true)}
            finally{btn.disabled=false}
        }

        async function downloadLargeFile(id){
            const f=APP.files.find(x=>x.id===id);
            if(!f)return;
            if(f.hasPassword){const p=prompt('🔒 File password:');if(!p||b64d(f.password)!==p){notify('⛔ Wrong!',true);return}}
            spin(true);
            try{
                const res=await fetch(f.downloadApiUrl,{headers:{'Authorization':`token ${APP.token}`,'Accept':'application/octet-stream'}});
                if(!res.ok)throw new Error('failed');
                const blob=await res.blob();
                const url=URL.createObjectURL(blob);
                const a=document.createElement('a');
                a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
                URL.revokeObjectURL(url);
                spin(false);closeModal();
                notify('✅ Downloaded!');
            }catch(e){spin(false);notify('❌ Download failed',true)}
        }

        async function deleteLargeFile(id){
            const f=APP.files.find(x=>x.id===id);
            if(!f)return;
            if(!confirm('Delete "'+f.name+'" permanently? This cannot be undone.'))return;
            spin(true);
            try{
                await gh(`/releases/assets/${f.assetId}`,'DELETE');
                APP.files=APP.files.filter(x=>x.id!==id);
                await saveFiles();
                spin(false);closeModal();renderDashboard();
                notify('🗑️ Deleted');
            }catch(e){spin(false);notify('❌ Delete failed',true)}
        }
