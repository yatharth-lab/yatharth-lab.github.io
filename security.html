<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER VAULT v8.0 | FINAL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Courier New', monospace; height: 100vh; overflow-y: auto; cursor: crosshair; }
        #matrixCanvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.2; }
        #binaryCanvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.15; }
        #particleCanvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.8; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,0,0.03) 2px, rgba(0,255,0,0.03) 4px); z-index: 2; pointer-events: none; animation: scanMove 8s linear infinite; }
        @keyframes scanMove { 0% { background-position: 0 0; } 100% { background-position: 0 100px; } }
        .crt-flicker { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; animation: flicker 0.15s infinite; }
        @keyframes flicker { 0% { background: transparent; } 50% { background: rgba(0,0,0,0.03); } 100% { background: transparent; } }
        .red-alert { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; background: transparent; transition: background 0.1s; }
        .red-alert.active { background: rgba(255,0,0,0.3); animation: alertFlash 0.5s 3; }
        @keyframes alertFlash { 0%,100% { background: transparent; } 50% { background: rgba(255,0,0,0.4); } }
        .main-container { position: relative; z-index: 10; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .terminal { background: rgba(0,0,0,0.93); border: 2px solid #0f0; border-radius: 15px; padding: 30px; width: 95%; max-width: 950px; box-shadow: 0 0 30px rgba(0,255,0,0.2), 0 0 80px rgba(0,255,0,0.1), inset 0 0 60px rgba(0,255,0,0.03), 0 0 120px rgba(0,0,0,0.5); animation: terminalPulse 2s infinite; backdrop-filter: blur(25px); max-height: 90vh; overflow-y: auto; position: relative; }
        .terminal::before { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; border-radius: 15px; border: 1px solid rgba(0,255,0,0.1); pointer-events: none; animation: circuitGlow 3s infinite; }
        @keyframes circuitGlow { 0%,100% { border-color: rgba(0,255,0,0.1); } 50% { border-color: rgba(0,255,0,0.3); } }
        @keyframes terminalPulse { 0%,100% { box-shadow: 0 0 30px rgba(0,255,0,0.2), 0 0 80px rgba(0,255,0,0.1), inset 0 0 60px rgba(0,255,0,0.03); } 50% { box-shadow: 0 0 50px rgba(0,255,0,0.4), 0 0 120px rgba(0,255,0,0.2), inset 0 0 80px rgba(0,255,0,0.06); } }
        .glitch-text { color: #0f0; font-size: 28px; font-weight: bold; text-align: center; text-transform: uppercase; animation: glitchAnim 1.5s infinite; text-shadow: 3px 3px #003300, -2px -2px rgba(255,0,0,0.3); margin-bottom: 20px; letter-spacing: 4px; }
        @keyframes glitchAnim { 0%,100% { transform: translate(0); } 20% { transform: translate(-4px,2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-2px,-3px); } 80% { transform: translate(2px,3px); } }
        .subtitle { color: #0a0; text-align: center; font-size: 13px; margin: 10px 0 25px; letter-spacing: 4px; }
        .cyber-input { background: rgba(0,30,0,0.6); border: 1px solid #0f0; color: #0f0; padding: 15px; width: 100%; margin: 8px 0; font-family: 'Courier New',monospace; font-size: 15px; border-radius: 8px; outline: none; transition: all 0.3s; letter-spacing: 2px; }
        .cyber-input:focus { box-shadow: 0 0 30px rgba(0,255,0,0.5), inset 0 0 20px rgba(0,255,0,0.1); background: rgba(0,50,0,0.8); border-color: #0f0; transform: scale(1.01); }
        .cyber-input::placeholder { color: rgba(0,255,0,0.2); }
        .cyber-btn { background: rgba(0,30,0,0.7); border: 2px solid #0f0; color: #0f0; padding: 15px 30px; font-family: 'Courier New',monospace; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: all 0.3s; margin: 5px; text-transform: uppercase; letter-spacing: 3px; position: relative; overflow: hidden; text-shadow: 0 0 10px rgba(0,255,0,0.5); }
        .cyber-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0,255,0,0.3), transparent); transition: left 0.5s; }
        .cyber-btn:hover::before { left: 100%; }
        .cyber-btn:hover { background: rgba(0,255,0,0.2); box-shadow: 0 0 50px rgba(0,255,0,0.6), inset 0 0 30px rgba(0,255,0,0.1); transform: translateY(-4px); border-color: #0f0; }
        .cyber-btn:active { transform: translateY(0); }
        .cyber-btn.danger { border-color: #ff0040; color: #ff0040; background: rgba(30,0,0,0.7); text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        .cyber-btn.danger:hover { background: rgba(255,0,0,0.25); box-shadow: 0 0 50px rgba(255,0,0,0.6); }
        .cyber-btn.warning { border-color: #ffaa00; color: #ffaa00; background: rgba(30,20,0,0.7); }
        .cyber-btn.success { border-color: #00ff88; color: #00ff88; background: rgba(0,30,20,0.7); }
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; margin: 20px 0; }
        .file-card { background: rgba(0,25,0,0.4); border: 1px solid rgba(0,255,0,0.3); padding: 20px; border-radius: 12px; transition: all 0.3s; cursor: pointer; position: relative; overflow: hidden; }
        .file-card:hover { background: rgba(0,255,0,0.1); box-shadow: 0 0 40px rgba(0,255,0,0.4); transform: translateY(-6px) scale(1.02); border-color: #0f0; }
        .file-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .file-icon { font-size: 36px; filter: drop-shadow(0 0 8px rgba(0,255,0,0.5)); }
        .file-name { color: #0f0; font-weight: bold; font-size: 15px; word-break: break-word; text-shadow: 0 0 5px rgba(0,255,0,0.3); }
        .file-meta { color: rgba(0,255,0,0.4); font-size: 11px; margin-top: 8px; }
        .file-actions { display: flex; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
        .mini-btn { padding: 6px 14px; font-size: 11px; border-radius: 5px; letter-spacing: 2px; }
        .notification { position: fixed; top: 20px; right: 20px; background: rgba(0,20,0,0.95); border: 1px solid #0f0; color: #0f0; padding: 20px 30px; border-radius: 10px; z-index: 1000; animation: slideInRight 0.5s, fadeOut 0.5s 3s forwards; backdrop-filter: blur(20px); box-shadow: 0 0 40px rgba(0,255,0,0.4); max-width: 400px; }
        .notification.error { border-color: #ff0040; color: #ff0040; }
        @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .spinner { border: 3px solid rgba(0,255,0,0.15); border-top: 3px solid #0f0; border-right: 3px solid #0f0; border-radius: 50%; width: 55px; height: 55px; animation: spin 0.6s linear infinite; margin: 20px auto; display: none; box-shadow: 0 0 30px rgba(0,255,0,0.4); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); }
        .modal-content { background: rgba(0,10,0,0.97); border: 2px solid #0f0; border-radius: 18px; padding: 35px; width: 90%; max-width: 580px; box-shadow: 0 0 80px rgba(0,255,0,0.5), inset 0 0 40px rgba(0,255,0,0.05); animation: modalIn 0.3s ease-out; max-height: 85vh; overflow-y: auto; }
        @keyframes modalIn { from { transform: scale(0.7) rotateY(10deg); opacity: 0; } to { transform: scale(1) rotateY(0); opacity: 1; } }
        .status-bar { color: #0a0; font-size: 11px; text-align: center; margin-top: 20px; letter-spacing: 3px; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        ::-webkit-scrollbar { width: 12px; } ::-webkit-scrollbar-track { background: #000; border: 1px solid #0f0; } ::-webkit-scrollbar-thumb { background: #0f0; border-radius: 6px; }
        select.cyber-input { appearance: none; cursor: pointer; }
        textarea.cyber-input { resize: vertical; min-height: 100px; }
        .boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; animation: bootFade 0.5s 2.5s forwards; }
        .boot-text { color: #0f0; font-family: 'Courier New',monospace; font-size: 14px; line-height: 1.8; text-align: left; }
        @keyframes bootFade { to { opacity: 0; pointer-events: none; } }
        @media (max-width:768px) { .terminal { padding: 20px; } .glitch-text { font-size: 22px; } .file-grid { grid-template-columns: 1fr; } .cyber-btn { padding: 12px 20px; font-size: 13px; } }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <canvas id="binaryCanvas"></canvas>
    <canvas id="particleCanvas"></canvas>
    <div class="scanlines"></div>
    <div class="crt-flicker"></div>
    <div class="red-alert" id="redAlert"></div>
    <div class="boot-screen" id="bootScreen"><div class="boot-text" id="bootText"></div></div>
    <div id="notificationContainer"></div>
    <div class="spinner" id="spinner"></div>
    <div class="main-container"><div class="terminal" id="terminal"></div></div>
    <div class="modal-overlay" id="modal"><div class="modal-content" id="modalContent"></div></div>

    <script>
        // ==================== PASSWORDS ====================
        const MASTER_PASSWORD = 'Y@th@Rth';
        const BACKUP_PASSWORD = 'mann';

        const APP = {
            githubToken: '', githubUsername: '', repoName: '',
            files: [], currentFolder: 'root', isAdmin: false, isLoggedIn: false
        };

        function b64Encode(str) { try { return btoa(unescape(encodeURIComponent(str))); } catch(e) { return btoa(str); } }
        function b64Decode(str) { try { return decodeURIComponent(escape(atob(str))); } catch(e) { return atob(str); } }
        function notify(msg, err=false) {
            const c = document.getElementById('notificationContainer');
            const d = document.createElement('div');
            d.className = `notification ${err?'error':''}`;
            d.textContent = msg;
            c.appendChild(d);
            setTimeout(() => d.remove(), 3500);
            if(err) { const a = document.getElementById('redAlert'); a.classList.add('active'); setTimeout(() => a.classList.remove('active'), 1500); }
        }
        function spin(show) { document.getElementById('spinner').style.display = show?'block':'none'; }
        function openModal(h) { document.getElementById('modalContent').innerHTML = h; document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        // Boot Sequence
        function bootSequence() {
            const lines = ['[BOOT] Initializing CYBER VAULT v8.0...','[OK] Kernel loaded','[OK] Encryption: AES-256','[OK] Secure channel','[OK] Matrix protocols','[OK] GitHub bridge','[OK] Storage: ONLINE','[READY] System initialized','','> ACCESS REQUIRED <'];
            const el = document.getElementById('bootText');
            let i = 0;
            function type() { if(i < lines.length) { el.innerHTML += lines[i] + '<br>'; i++; setTimeout(type, Math.random()*200+100); } }
            type();
            setTimeout(() => { document.getElementById('bootScreen').style.display = 'none'; }, 2800);
        }

        // Matrix Rain
        const mCanvas = document.getElementById('matrixCanvas');
        const mCtx = mCanvas.getContext('2d');
        mCanvas.width = window.innerWidth; mCanvas.height = window.innerHeight;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*{}[]|/\\<>';
        const fs = 16;
        let cols = Math.floor(mCanvas.width/fs);
        let drops = Array(cols).fill(1);
        function drawMatrix() { mCtx.fillStyle='rgba(0,0,0,0.05)'; mCtx.fillRect(0,0,mCanvas.width,mCanvas.height); mCtx.fillStyle='#0f0'; mCtx.font=`${fs}px monospace`; for(let i=0;i<drops.length;i++) { mCtx.fillText(chars[Math.floor(Math.random()*chars.length)], i*fs, drops[i]*fs); if(drops[i]*fs>mCanvas.height&&Math.random()>0.975) drops[i]=0; drops[i]++; } }
        setInterval(drawMatrix, 45);

        // Binary Rain
        const bCanvas = document.getElementById('binaryCanvas');
        const bCtx = bCanvas.getContext('2d');
        bCanvas.width = window.innerWidth; bCanvas.height = window.innerHeight;
        const bFs = 20;
        let bCols = Math.floor(bCanvas.width/bFs);
        let bDrops = Array(bCols).fill(1);
        function drawBinary() { bCtx.fillStyle='rgba(0,0,0,0.03)'; bCtx.fillRect(0,0,bCanvas.width,bCanvas.height); bCtx.fillStyle='rgba(0,255,0,0.3)'; bCtx.font=`${bFs}px monospace`; for(let i=0;i<bDrops.length;i++) { bCtx.fillText(Math.random()>0.5?'0':'1', i*bFs, bDrops[i]*bFs); if(bDrops[i]*bFs>bCanvas.height&&Math.random()>0.99) bDrops[i]=0; bDrops[i]++; } }
        setInterval(drawBinary, 80);

        // Particles
        const pCanvas = document.getElementById('particleCanvas');
        const pCtx = pCanvas.getContext('2d');
        pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight;
        const particles = Array.from({length:40}, () => ({ x:Math.random()*pCanvas.width, y:Math.random()*pCanvas.height, vx:(Math.random()-0.5)*0.8, vy:(Math.random()-0.5)*0.8, size:Math.random()*2+0.5, alpha:Math.random()*0.4+0.1 }));
        function drawParticles() { pCtx.clearRect(0,0,pCanvas.width,pCanvas.height); particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>pCanvas.width) p.vx*=-1; if(p.y<0||p.y>pCanvas.height) p.vy*=-1; pCtx.fillStyle=`rgba(0,255,0,${p.alpha})`; pCtx.shadowBlur=8; pCtx.shadowColor='#0f0'; pCtx.beginPath(); pCtx.arc(p.x,p.y,p.size,0,Math.PI*2); pCtx.fill(); pCtx.shadowBlur=0; }); requestAnimationFrame(drawParticles); }
        drawParticles();

        window.addEventListener('resize', () => { mCanvas.width=bCanvas.width=pCanvas.width=window.innerWidth; mCanvas.height=bCanvas.height=pCanvas.height=window.innerHeight; cols=Math.floor(mCanvas.width/fs); drops=Array(cols).fill(1); bCols=Math.floor(bCanvas.width/bFs); bDrops=Array(bCols).fill(1); });

        // GitHub API
        async function gh(endpoint, method='GET', body=null) {
            if(!APP.githubToken || !APP.githubUsername || !APP.repoName) throw new Error('API not configured');
            const url = `https://api.github.com/repos/${APP.githubUsername}/${APP.repoName}${endpoint}`;
            const headers = { 'Authorization': `token ${APP.githubToken}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
            const opts = { method, headers };
            if(body) opts.body = JSON.stringify(body);
            const res = await fetch(url, opts);
            if(!res.ok) throw new Error('API Error');
            return res.json();
        }

        async function loadStorage() { try { const r = await gh('/contents/storage/data.json'); return JSON.parse(b64Decode(r.content)); } catch(e) { return { files: [] }; } }
        async function saveStorage(data) { try { const existing = await gh('/contents/storage/data.json').catch(()=>null); const body = { message: 'Update vault', content: b64Encode(JSON.stringify(data,null,2)), branch: 'main' }; if(existing) body.sha = existing.sha; await gh('/contents/storage/data.json', 'PUT', body); } catch(e) { throw new Error('Save failed'); } }
        async function loadFiles() { const d = await loadStorage(); APP.files = d.files || []; }
        async function saveFiles() { const d = await loadStorage(); d.files = APP.files; await saveStorage(d); }

        function saveAPI() { localStorage.setItem('vault_api', b64Encode(JSON.stringify({ token: APP.githubToken, username: APP.githubUsername, repo: APP.repoName }))); }
        function loadAPI() { const s = localStorage.getItem('vault_api'); if(s) { try { const d = JSON.parse(b64Decode(s)); APP.githubToken = d.token; APP.githubUsername = d.username; APP.repoName = d.repo; return true; } catch(e) { return false; } } return false; }

        // ==================== UI ====================
        function renderLogin() {
            document.getElementById('terminal').innerHTML = `
                <div style="text-align:center;">
                    <h1 class="glitch-text">⚡ CYBER VAULT v8.0</h1>
                    <p class="subtitle">[ ENCRYPTED CHANNEL // SECURE ACCESS ]</p>
                    <div style="max-width:420px;margin:30px auto;">
                        <input type="password" id="userPassword" class="cyber-input" placeholder="ENTER MASTER PASSWORD" style="text-align:center;font-size:18px;">
                        <button class="cyber-btn" onclick="userLogin()" style="width:100%;margin-top:20px;">🔐 ACCESS VAULT</button>
                        <button class="cyber-btn warning" onclick="renderAdminLogin()" style="width:100%;margin-top:10px;font-size:13px;">⚙️ ADMIN PANEL</button>
                    </div>
                    <div class="status-bar">[ SYSTEM v8.0 ] [ AES-256 ] [ SECURE PROTOCOL ]</div>
                </div>`;
        }

        function renderAdminLogin() {
            document.getElementById('terminal').innerHTML = `
                <div style="text-align:center;">
                    <h1 class="glitch-text">⚙️ ADMIN SETUP</h1>
                    <p class="subtitle">[ ONE-TIME CONFIGURATION ]</p>
                    <div style="text-align:left;max-width:500px;margin:0 auto;">
                        <label style="color:#0f0;">🔑 GitHub Token</label>
                        <input type="password" id="adminToken" class="cyber-input" placeholder="ghp_xxx">
                        <label style="color:#0f0;">👤 Username</label>
                        <input type="text" id="adminUser" class="cyber-input" placeholder="username">
                        <label style="color:#0f0;">📦 Repository</label>
                        <input type="text" id="adminRepo" class="cyber-input" placeholder="repo-name">
                        <label style="color:#0f0;">🛡️ Backup Password</label>
                        <input type="password" id="adminBackup" class="cyber-input" placeholder="Backup password">
                    </div>
                    <button class="cyber-btn success" onclick="adminSetup()" style="width:100%;margin-top:20px;">🚀 INITIALIZE & SAVE</button>
                    <button class="cyber-btn danger" onclick="renderLogin()" style="width:100%;margin-top:10px;">↩️ BACK</button>
                    <div class="status-bar">[ API SAVED TO LOCAL STORAGE ]</div>
                </div>`;
        }

        function renderDashboard() {
            const currentFiles = APP.files.filter(f => f.folder === APP.currentFolder);
            const folders = [...new Set(APP.files.map(f => f.folder))];
            document.getElementById('terminal').innerHTML = `
                <div>
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
                        <h1 class="glitch-text" style="font-size:24px;margin:0;">📁 ${APP.currentFolder.toUpperCase()}</h1>
                        <span style="color:#0f0;">${currentFiles.length} ITEMS</span>
                    </div>
                    <div style="display:flex;gap:8px;margin:20px 0;flex-wrap:wrap;">
                        ${APP.isAdmin ? `<button class="cyber-btn" onclick="showUploadForm()">⬆️ UPLOAD</button><button class="cyber-btn warning" onclick="showPassManager()">🔑 PASSWORDS</button>` : ''}
                        ${APP.currentFolder !== 'root' ? `<button class="cyber-btn" onclick="changeFolder('root')">↩️ ROOT</button>` : ''}
                        <button class="cyber-btn danger" onclick="logout()">🚪 ${APP.isAdmin ? 'EXIT' : 'LOCK'}</button>
                    </div>
                    ${folders.length > 1 ? `<div style="margin-bottom:15px;"><span style="color:#0a0;">📁 </span>${folders.filter(f=>f!=='root').map(f=>`<button class="cyber-btn mini-btn" onclick="changeFolder('${f}')">${f}</button>`).join(' ')}</div>` : ''}
                    <div class="file-grid">
                        ${currentFiles.length === 0 ? `<div style="color:rgba(0,255,0,0.3);text-align:center;grid-column:1/-1;padding:60px;">[ EMPTY ]</div>` :
                            currentFiles.map(f => `
                                <div class="file-card" onclick="${f.hasPassword && !APP.isAdmin ? `promptPass('${f.id}')` : `viewFile('${f.id}')`}">
                                    <div class="file-header"><span class="file-icon">${f.type==='image'?'🖼️':f.type==='video'?'🎥':'📄'}</span>${f.hasPassword?'<span style="color:#ff0040;">🔒</span>':'<span style="color:#0f0;">🔓</span>'}</div>
                                    <div class="file-name">${f.name}</div>
                                    <div class="file-meta">${f.type} | ${f.size||0}KB</div>
                                    ${APP.isAdmin ? `<div class="file-actions"><button class="cyber-btn mini-btn" onclick="event.stopPropagation();viewFile('${f.id}')">👁️</button><button class="cyber-btn warning mini-btn" onclick="event.stopPropagation();changePass('${f.id}')">🔄</button><button class="cyber-btn danger mini-btn" onclick="event.stopPropagation();delFile('${f.id}')">🗑️</button></div>` : ''}
                                </div>`).join('')}
                    </div>
                    <div class="status-bar">[ ${APP.isAdmin?'ADMIN':'USER'} ] [ CONNECTED ]</div>
                </div>`;
        }

        function showUploadForm() {
            openModal(`<h2 class="glitch-text" style="font-size:20px;">⬆️ UPLOAD</h2><label style="color:#0f0;">📁 Folder</label><input id="ufolder" class="cyber-input" placeholder="root"><label style="color:#0f0;">📄 Name</label><input id="uname" class="cyber-input" placeholder="file"><label style="color:#0f0;">📂 Type</label><select id="utype" class="cyber-input"><option value="document">📄 Doc</option><option value="image">🖼️ Img</option><option value="video">🎥 Vid</option></select><label style="color:#0f0;">📝 Content</label><textarea id="ucontent" class="cyber-input" rows="5"></textarea><label style="color:#0f0;">🔒 Pass</label><input type="password" id="upass" class="cyber-input" placeholder="Optional"><button class="cyber-btn success" onclick="doUpload()" style="width:100%;margin-top:15px;">🚀 UPLOAD</button><button class="cyber-btn danger" onclick="closeModal()" style="width:100%;">CANCEL</button>`);
        }

        function showPassManager() {
            const locked = APP.files.filter(f => f.hasPassword);
            openModal(`<h2 class="glitch-text" style="font-size:20px;">🔑 PASSWORDS</h2><p style="color:#0f0;">Locked: ${locked.length}</p>${locked.map(f => `<div style="background:rgba(0,25,0,0.5);padding:10px;margin:5px 0;border-radius:5px;display:flex;justify-content:space-between;"><span style="color:#0f0;">🔒 ${f.name}</span><button class="cyber-btn warning mini-btn" onclick="changePass('${f.id}');closeModal();">🔄</button></div>`).join('')||'<p style="color:#0a0;">None</p>'}<button class="cyber-btn warning" onclick="setAllPass()" style="width:100%;margin:10px 0;">LOCK ALL</button><button class="cyber-btn" onclick="remAllPass()" style="width:100%;">UNLOCK ALL</button><button class="cyber-btn danger" onclick="closeModal()" style="width:100%;margin-top:15px;">CLOSE</button>`);
        }

        // ==================== ACTIONS ====================
        async function userLogin() {
            const pass = document.getElementById('userPassword').value;
            if(pass !== MASTER_PASSWORD) { notify('⛔ ACCESS DENIED', true); return; }
            
            // Try to load API from localStorage
            const hasAPI = loadAPI();
            
            if(!hasAPI) {
                // No API configured - show empty dashboard with admin button
                APP.isLoggedIn = true;
                APP.isAdmin = false;
                APP.files = [];
                notify('⚠️ No storage configured. Use Admin Panel to setup.');
                renderDashboard();
                return;
            }

            spin(true);
            try {
                await loadFiles();
                APP.isLoggedIn = true;
                APP.isAdmin = false;
                spin(false);
                notify('✅ ACCESS GRANTED');
                renderDashboard();
            } catch(e) {
                spin(false);
                APP.isLoggedIn = true;
                APP.isAdmin = false;
                APP.files = [];
                notify('⚠️ Connection failed. Check admin setup.', true);
                renderDashboard();
            }
        }

        async function adminSetup() {
            const token = document.getElementById('adminToken').value.trim();
            const user = document.getElementById('adminUser').value.trim();
            const repo = document.getElementById('adminRepo').value.trim();
            const backup = document.getElementById('adminBackup').value;
            if(!token||!user||!repo||!backup) { notify('❌ All fields required', true); return; }
            if(backup !== BACKUP_PASSWORD) { notify('⛔ Wrong backup password', true); return; }
            APP.githubToken = token; APP.githubUsername = user; APP.repoName = repo;
            spin(true);
            try {
                await gh('/contents');
                await loadFiles();
                saveAPI();
                APP.isLoggedIn = true; APP.isAdmin = true;
                spin(false);
                notify('✅ Admin setup complete!');
                renderDashboard();
            } catch(e) { spin(false); notify('❌ Connection failed', true); }
        }

        async function doUpload() {
            const folder = document.getElementById('ufolder').value.trim() || 'root';
            const name = document.getElementById('uname').value.trim();
            const type = document.getElementById('utype').value;
            const content = document.getElementById('ucontent').value;
            const pass = document.getElementById('upass').value;
            if(!name||!content) { notify('❌ Name & content required', true); return; }
            spin(true);
            try {
                APP.files.push({ id: Date.now().toString(), name, type, folder, password: pass ? b64Encode(pass) : '', hasPassword: !!pass, content: b64Encode(content), size: Math.round(content.length*0.75/1024), createdAt: new Date().toISOString() });
                await saveFiles();
                spin(false); closeModal();
                notify('✅ Uploaded!');
                renderDashboard();
            } catch(e) { spin(false); notify('❌ Failed', true); }
        }

        function viewFile(fileId) {
            const f = APP.files.find(x => x.id === fileId);
            if(!f) return;
            const content = f.content ? b64Decode(f.content) : '';
            openModal(`<h2 class="glitch-text" style="font-size:18px;">📄 ${f.name}</h2><div style="color:#0a0;font-size:12px;">${f.type} | ${f.size}KB</div><div style="max-height:55vh;overflow-y:auto;margin:15px 0;background:rgba(0,25,0,0.5);padding:15px;border-radius:8px;border:1px solid #0f0;">${f.type==='image'?`<img src="${content}" style="max-width:100%;">`:f.type==='video'?`<video controls style="max-width:100%;"><source src="${content}"></video>`:`<pre style="color:#0f0;white-space:pre-wrap;">${content}</pre>`}</div><button class="cyber-btn" onclick="closeModal()" style="width:100%;">CLOSE</button>`);
        }

        function promptPass(fileId) {
            const pass = prompt('🔒 File password:');
            if(pass) { const f = APP.files.find(x => x.id === fileId); if(f && b64Decode(f.password) === pass) viewFile(fileId); else notify('⛔ Wrong!', true); }
        }

        async function changePass(fileId) {
            const backup = prompt('🛡️ Backup password:');
            if(backup !== BACKUP_PASSWORD) { notify('⛔ Wrong!', true); return; }
            const newPass = prompt('New password (empty=remove):');
            const f = APP.files.find(x => x.id === fileId);
            if(f) { f.password = newPass ? b64Encode(newPass) : ''; f.hasPassword = !!newPass; await saveFiles(); notify(newPass ? '🔒 Updated!' : '🔓 Removed!'); renderDashboard(); }
        }

        async function delFile(fileId) { if(confirm('Delete?')) { APP.files = APP.files.filter(f => f.id !== fileId); await saveFiles(); notify('🗑️ Deleted!'); renderDashboard(); } }
        async function setAllPass() { const pass = prompt('Password for ALL:'); if(pass) { APP.files.forEach(f => { f.password = b64Encode(pass); f.hasPassword = true; }); await saveFiles(); notify('🔒 All locked!'); renderDashboard(); } }
        async function remAllPass() { if(confirm('Remove all?')) { APP.files.forEach(f => { f.password = ''; f.hasPassword = false; }); await saveFiles(); notify('🔓 All unlocked!'); renderDashboard(); } }
        function changeFolder(folder) { APP.currentFolder = folder; renderDashboard(); }
        function logout() { APP.isLoggedIn = false; APP.isAdmin = false; APP.files = []; APP.currentFolder = 'root'; renderLogin(); }

        document.addEventListener('keypress', e => { if(e.key === 'Enter') { const inp = document.getElementById('userPassword'); if(inp && document.activeElement === inp) userLogin(); } });
        document.getElementById('modal').addEventListener('click', function(e) { if(e.target === this) closeModal(); });

        bootSequence();
        setTimeout(renderLogin, 3000);
    </script>
</body>
</html>
