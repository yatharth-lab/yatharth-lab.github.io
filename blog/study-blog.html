<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentBlog - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 40px 50px;
            border-radius: 24px;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(26, 26, 46, 0.3);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.2), transparent);
            border-radius: 50%;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 800;
            color: white;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.8;
        }

        .header .stats {
            display: flex;
            gap: 40px;
            margin-top: 20px;
        }

        .header .stats div {
            color: white;
        }

        .header .stats span {
            font-size: 1.8rem;
            font-weight: 700;
            color: #818cf8;
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            background: white;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .filter-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 16px;
            background: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #e2e8f0;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.3);
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .blog-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .blog-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(79, 70, 229, 0.15);
            border-color: #4f46e5;
        }

        .blog-card .image-wrap {
            height: 220px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }

        .blog-card .image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .blog-card .image-wrap .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 20px 20px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
        }

        .blog-card .image-wrap .category-tag {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 30px;
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .blog-card .content {
            padding: 24px;
        }

        .blog-card .content .meta {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .blog-card .content .meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .blog-card .content h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .blog-card .content p {
            color: #475569;
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .blog-card .content .read-time {
            color: #4f46e5;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .blog-card .content .read-time::after {
            content: '→';
            transition: transform 0.3s;
        }

        .blog-card:hover .content .read-time::after {
            transform: translateX(5px);
        }

        .no-results {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }

        .footer {
            text-align: center;
            padding: 40px 0;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 40px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 768px) {
            .header {
                padding: 30px 25px;
            }
            .header h1 {
                font-size: 2.2rem;
            }
            .header .stats {
                gap: 20px;
                flex-wrap: wrap;
            }
            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>📚 Student<span>Blog</span></h1>
                <p>Smart tips, AI tools, study hacks & career guidance — <br>all in one place for students like you.</p>
                <div class="stats">
                    <div>📝 <span id="postCount">0</span> Posts</div>
                    <div>👥 <span>500+</span> Readers</div>
                </div>
            </div>
        </div>

        <div class="filters">
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search posts...">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="AI">🤖 AI</button>
            <button class="filter-btn" data-filter="Study">📖 Study</button>
            <button class="filter-btn" data-filter="Career">💼 Career</button>
            <button class="filter-btn" data-filter="Tech">💻 Tech</button>
        </div>

        <div class="blog-grid" id="blogGrid"></div>

        <div class="footer">
            © 2026 StudentBlog • Built with ❤️ on GitHub Pages
        </div>
    </div>

    <script src="blog.js"></script>
    <script>
        let currentFilter = 'all';
        let searchQuery = '';

        function renderPosts(posts) {
            const grid = document.getElementById('blogGrid');

            if (!posts || posts.length === 0) {
                grid.innerHTML = `<div class="no-results">⏳ Loading posts...</div>`;
                return;
            }

            const filtered = posts.filter(post => {
                const matchesFilter = currentFilter === 'all' || post.category === currentFilter;
                const matchesSearch = post.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    post.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-results">😕 No posts found. Try a different search!</div>`;
                return;
            }

            grid.innerHTML = filtered.map(post => {
                const imageSrc = post.imageUrl || post.image || '';
                return `
                <div class="blog-card" onclick="window.location.href='blog-post.html?id=${post.id}'">
                    <div class="image-wrap">
                        ${imageSrc ? 
                            `<img src="${imageSrc}" alt="${post.title}" loading="lazy">` : 
                            `<span>📄</span>`
                        }
                        <div class="overlay">
                            <span class="category-tag">${post.category}</span>
                        </div>
                    </div>
                    <div class="content">
                        <div class="meta">
                            <span>📅 ${post.date || '2026'}</span>
                            <span>⏱️ ${post.readTime || '5 min'}</span>
                            <span>👁️ ${post.views || 0}</span>
                        </div>
                        <h2>${post.title}</h2>
                        <p>${post.description}</p>
                        <div class="read-time">Read Article</div>
                    </div>
                </div>
            `}).join('');

            document.getElementById('postCount').textContent = posts.length;
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                if (typeof blogPosts !== 'undefined') {
                    renderPosts(blogPosts);
                }
            });
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            searchQuery = e.target.value;
            if (typeof blogPosts !== 'undefined') {
                renderPosts(blogPosts);
            }
        });

        if (typeof blogPosts !== 'undefined' && Array.isArray(blogPosts)) {
            renderPosts(blogPosts);
        } else {
            document.getElementById('blogGrid').innerHTML =
                `<div class="no-results">⏳ Loading posts...</div>`;
            setTimeout(() => {
                if (typeof blogPosts !== 'undefined' && Array.isArray(blogPosts)) {
                    renderPosts(blogPosts);
                }
            }, 1000);
        }
    </script>

</body>
</html>
