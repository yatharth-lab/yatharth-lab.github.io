<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - GlassBlog</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <style>
        .admin-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .admin-container .glass {
            padding: 35px;
            color: #fff;
        }
        .admin-container h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        .admin-container .subtitle {
            opacity: 0.7;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            opacity: 0.9;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.12);
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .btn-submit {
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ffd700, #f5a623);
            color: #1a1a2e;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-submit:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        .image-upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .image-upload-area:hover {
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.05);
        }
        .image-upload-area i {
            font-size: 40px;
            opacity: 0.5;
            display: block;
            margin-bottom: 10px;
        }
        .image-preview {
            margin-top: 15px;
            display: none;
        }
        .image-preview img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .github-config {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .github-config h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .github-config .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .github-config .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .success-msg {
            background: rgba(46, 213, 115, 0.2);
            border: 1px solid #2ed573;
            color: #2ed573;
            padding: 12px 20px;
            border-radius: 12px;
            display: none;
            margin-bottom: 20px;
        }
        .success-msg.show {
            display: block;
        }
        .error-msg {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 12px 20px;
            border-radius: 12px;
            display: none;
            margin-bottom: 20px;
        }
        .error-msg.show {
            display: block;
        }
        
        .config-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        .config-status.configured {
            background: rgba(46, 213, 115, 0.3);
            color: #2ed573;
        }
        .config-status.not-configured {
            background: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }
        
        .crop-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .crop-modal.active {
            display: flex;
        }
        .crop-modal .modal-content {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 20px;
            max-width: 600px;
            width: 95%;
        }
        .crop-modal .modal-content h3 {
            color: #fff;
            margin-bottom: 15px;
        }
        .crop-modal .modal-content .crop-container {
            max-height: 400px;
        }
        .crop-modal .modal-content .crop-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }
        .crop-modal .modal-content .crop-actions button {
            padding: 8px 25px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .crop-modal .modal-content .crop-actions .btn-crop {
            background: #ffd700;
            color: #1a1a2e;
        }
        .crop-modal .modal-content .crop-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .crop-modal .modal-content .crop-actions button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav class="glass-nav">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-crown"></i>
                <span>GlassBlog</span>
            </div>
            <div>
                <a href="index.html" class="admin-btn">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="admin.html" class="admin-btn" style="background:rgba(255,215,0,0.2);border-color:#ffd700;">
                    <i class="fas fa-user-shield"></i> Admin
                </a>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="glass">
            <h1>📝 Admin Panel</h1>
            <p class="subtitle">Manage your blogs with GitHub integration</p>

            <div id="successMsg" class="success-msg">
                <i class="fas fa-check-circle"></i> <span id="successText">Success!</span>
            </div>
            <div id="errorMsg" class="error-msg">
                <i class="fas fa-exclamation-circle"></i> <span id="errorText">Error!</span>
            </div>

            <!-- GitHub Configuration -->
            <div class="github-config">
                <h3>
                    🔗 GitHub Configuration
                    <span id="configStatus" class="config-status not-configured">Not Configured</span>
                </h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>GitHub Token (PAT)</label>
                        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" />
                    </div>
                    <div class="form-group">
                        <label>GitHub Username</label>
                        <input type="text" id="githubUsername" placeholder="your-username" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Repository Name</label>
                        <input type="text" id="githubRepo" placeholder="your-repo" />
                    </div>
                    <div class="form-group" style="display:flex;align-items:flex-end;">
                        <button class="btn-submit btn-secondary" onclick="saveGitHubConfig()" style="width:100%;">
                            <i class="fas fa-save"></i> Save Config
                        </button>
                    </div>
                </div>
                <p style="font-size:12px;opacity:0.6;margin-top:10px;">
                    <i class="fas fa-info-circle"></i> 
                    PAT needs <strong>repo</strong> and <strong>workflow</strong> permissions.
                    <a href="https://github.com/settings/tokens" target="_blank" style="color:#ffd700;">Create Token</a>
                </p>
            </div>

            <!-- Add Blog Form -->
            <h2 style="margin-top:30px;">✍️ Add New Blog</h2>
            <form id="blogForm">
                <div class="form-group">
                    <label>Blog Title</label>
                    <input type="text" id="blogTitle" placeholder="Enter blog title..." required />
                </div>

                <div class="form-group">
                    <label>Content / Description</label>
                    <textarea id="blogDescription" placeholder="Write your blog content here..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Featured Image (1:1 ratio recommended)</label>
                    <div class="image-upload-area" id="imageUploadArea">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Click to upload image</p>
                        <input type="file" id="imageInput" accept="image/*" style="display:none;" />
                    </div>
                    <div class="image-preview" id="imagePreview">
                        <img id="previewImg" src="#" alt="Preview" />
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Publish Blog
                </button>
            </form>
        </div>
    </div>

    <!-- Crop Modal -->
    <div class="crop-modal" id="cropModal">
        <div class="modal-content">
            <h3>✂️ Crop Image (1:1)</h3>
            <div class="crop-container">
                <img id="cropImage" src="#" alt="Crop" style="max-width:100%;" />
            </div>
            <div class="crop-actions">
                <button class="btn-cancel" onclick="closeCrop()">Cancel</button>
                <button class="btn-crop" onclick="applyCrop()">Crop & Upload</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="blog.js"></script>
    <script src="admin.js"></script>
</body>
</html>
