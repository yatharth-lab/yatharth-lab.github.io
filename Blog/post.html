<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post - GlassBlog</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .blog-post {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .blog-post .glass {
            padding: 40px;
            color: #fff;
        }
        .blog-post img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .blog-post h1 {
            font-size: 32px;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        .blog-post .post-meta {
            opacity: 0.7;
            font-size: 14px;
            margin-bottom: 25px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .blog-post .post-content {
            font-size: 17px;
            line-height: 1.9;
            opacity: 0.95;
        }
        .blog-post .post-content p {
            margin-bottom: 15px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 30px;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-5px);
        }
        .post-not-found {
            text-align: center;
            padding: 40px;
        }
        .post-not-found i {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <nav class="glass-nav">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-crown"></i>
                <span>GlassBlog</span>
            </div>
            <a href="index.html" class="admin-btn">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
    </nav>

    <div class="blog-post" id="blogPost">
        <div class="glass">
            <div id="postContent">
                <div class="loading-spinner" style="text-align:center;padding:40px;color:#fff;">
                    <i class="fas fa-spinner fa-spin" style="font-size:40px;"></i>
                    <p style="margin-top:15px;">Loading post...</p>
                </div>
            </div>
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Blogs
            </a>
        </div>
    </div>

    <script src="blog.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await loadBlogsFromGitHub();
            
            const params = new URLSearchParams(window.location.search);
            const blogId = params.get('id');
            
            if (!blogId) {
                document.getElementById('postContent').innerHTML = `
                    <div class="post-not-found">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>Blog not found!</h2>
                        <p>Invalid blog ID.</p>
                    </div>
                `;
                return;
            }
            
            const blog = getBlogById(blogId);
            
            if (!blog) {
                document.getElementById('postContent').innerHTML = `
                    <div class="post-not-found">
                        <i class="fas fa-file-alt"></i>
                        <h2>Blog not found!</h2>
                        <p>The blog you're looking for doesn't exist or has been removed.</p>
                    </div>
                `;
                return;
            }
            
            // Display the blog
            document.getElementById('postContent').innerHTML = `
                <img src="${blog.image || 'https://via.placeholder.com/800x450/764ba2/ffffff?text=No+Image'}" 
                     alt="${blog.title}" 
                     loading="lazy" />
                <h1>${blog.title}</h1>
                <div class="post-meta">
                    <span><i class="far fa-calendar-alt"></i> ${formatDate(blog.date)}</span>
                    <span><i class="far fa-eye"></i> ${(blog.views || 0) + 1} views</span>
                </div>
                <div class="post-content">${blog.description.replace(/\n/g, '<br>')}</div>
            `;
            
            // Update views
            blog.views = (blog.views || 0) + 1;
            await saveBlogsToGitHub(blogs);
        });
    </script>
</body>
</html>
