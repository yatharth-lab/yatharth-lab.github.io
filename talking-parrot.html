<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦜 Talking Parrot</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:url("https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1600")
center/cover no-repeat;
font-family:Arial;
overflow:hidden;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.35);
}

.container{
position:relative;
z-index:2;
text-align:center;
}

#parrot{
width:300px;
max-width:80vw;
transition:0.1s;
animation:float 3s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

.talking{
animation:shake 0.1s infinite alternate;
}

@keyframes shake{
0%{transform:rotate(-6deg) scale(1.05);}
100%{transform:rotate(6deg) scale(1.1);}
}

h1{
color:white;
text-shadow:2px 2px 5px black;
margin-top:10px;
}

#status{
color:white;
margin-top:15px;
font-size:20px;
min-height:40px;
text-shadow:2px 2px 5px black;
}

button{
margin-top:20px;
padding:14px 26px;
font-size:18px;
border:none;
border-radius:30px;
background:#00c853;
color:white;
cursor:pointer;
font-weight:bold;
}

button:hover{
transform:scale(1.05);
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

<img id="parrot" src="parrot-closed.png" data-state="closed">

<h1>🦜 Talking Parrot</h1>

<div id="status">🎤 Tap and speak</div>

<button onclick="startTalking()">Speak 🎤</button>

</div>

<script>

const parrot = document.getElementById("parrot");
const status = document.getElementById("status");

function startTalking(){

const SpeechRecognition =
window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
status.innerText = "❌ Browser mic support nahi hai";
return;
}

const recognition = new SpeechRecognition();
recognition.lang = "hi-IN";
recognition.interimResults = false;

recognition.start();

status.innerText = "🎧 Sun raha hoon...";

recognition.onerror = (e)=>{
status.innerText = "⚠️ Mic error: " + e.error;
};

recognition.onresult = (event)=>{

const text = event.results[0][0].transcript;

status.innerText = "🗣️ " + text;

const speech = new SpeechSynthesisUtterance(text);
speech.lang = "hi-IN";

// 🔥 HARD + SHARP + CARTOON VOICE
speech.rate = 1.3;
speech.pitch = 2.2;
speech.volume = 1;

speechSynthesis.cancel();

speech.onstart = ()=>{

parrot.classList.add("talking");

parrot.src = "parrot-open.png";
parrot.setAttribute("data-state","open");
};

speech.onend = ()=>{

parrot.classList.remove("talking");

parrot.src = "parrot-closed.png";
parrot.setAttribute("data-state","closed");

status.innerText = "😂 Fir se bolo!";
};

speechSynthesis.speak(speech);

};

}

</script>

</body>
</html>
