<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> विवाह पंजीकरण फॉर्म </title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  margin:0;
  background:linear-gradient(135deg,#fff8e1,#ffe0b2,#ffcc80);
}

/* BOX */
.box{
  max-width:600px;
  margin:auto;
  background:rgba(255,255,255,0.96);
  padding:14px;
  margin-top:12px;
  border-radius:16px;
  border:2px solid #ffb74d;
  box-shadow:0 8px 25px rgba(255,111,0,0.18);
}

/* TITLES */
h2,h3{
  text-align:center;
  color:#e65100;
}

/* INPUT */
input,select,button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ffb74d;
  font-size:14px;
}

input:focus,select:focus{
  outline:none;
  box-shadow:0 0 8px rgba(255,111,0,0.3);
}

/* BUTTON */
button{
  background:linear-gradient(90deg,#ff9800,#ff5722);
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.02);
}

.adminBtn{
  background:linear-gradient(90deg,#b71c1c,#ff6f00);
}

/* CARD */
.card{
  background:linear-gradient(135deg,#fff3e0,#ffe0b2);
  margin:10px 0;
  padding:12px;
  border-radius:14px;
  border-left:6px solid #ff9800;
}

/* IMAGE */
img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:12px;
}

/* HIDDEN */
.hidden{display:none}

/* SECTION */
.section{
  background:linear-gradient(90deg,#ffe082,#ffb74d);
  padding:7px;
  margin-top:10px;
  border-radius:8px;
  font-weight:bold;
  text-align:center;
}

/* FILTER */
.filterBar{
  background:#fff3e0;
  padding:12px;
  border-radius:12px;
  border:1px solid #ffcc80;
}
</style>
</head>

<body>

<!-- FORM -->
<div class="box" id="formBox">
<h2>💍 विवाह पंजीकरण फॉर्म</h2>

<div class="section">व्यक्तिगत जानकारी</div>
<input id="name" placeholder="पूरा नाम">
<input id="age" type="number" placeholder="उम्र">

<select id="gender">
<option>पुरुष</option>
<option>महिला</option>
</select>

<select id="status">
<option>अविवाहित</option>
<option>तलाकशुदा</option>
<option>विधवा / विधुर</option>
</select>

<input id="dob" placeholder="जन्म तिथि">
<input id="height" placeholder="ऊँचाई">
<input id="weight" placeholder="वजन">

<div class="section">संपर्क</div>
<input id="mobile" placeholder="मोबाइल नंबर">
<input id="city" placeholder="शहर">
<input id="state" placeholder="राज्य">

<div class="section">धर्म / जाति</div>
<input id="religion" placeholder="धर्म">
<input id="caste" placeholder="जाति">

<div class="section">शिक्षा</div>
<input id="education" placeholder="शिक्षा">

<div class="section">नौकरी / व्यवसाय</div>
<select id="jobType">
<option>नौकरी</option>
<option>सरकारी नौकरी</option>
<option>प्राइवेट नौकरी</option>
<option>व्यवसाय</option>
</select>

<input id="job" placeholder="कंपनी / व्यवसाय">
<input id="income" placeholder="मासिक आय">

<div class="section">परिवार</div>
<input id="father" placeholder="पिता का नाम">
<input id="mother" placeholder="माता का नाम">
<input id="siblings" placeholder="भाई-बहन">
<input id="familyType" placeholder="परिवार प्रकार">

<div class="section">जीवनसाथी की पसंद</div>
<input id="prefAge" placeholder="उम्र (22-28)">
<input id="prefHeight" placeholder="ऊँचाई">
<input id="prefCaste" placeholder="जाति">
<input id="prefReligion" placeholder="धर्म">
<input id="prefJob" placeholder="नौकरी">
<input id="prefCity" placeholder="शहर">
<input id="prefIncome" placeholder="आय">
<div class="section">फोटो अपलोड करें</div>
<input type="file" id="image">

<button onclick="submitData()">फॉर्म जमा करें</button>
</div>

<!-- ADMIN -->
<div class="box">
<button class="adminBtn" onclick="openAdmin()">🔐 एडमिन पैनल</button>
</div>

<div class="box hidden" id="loginBox">
<h3>एडमिन लॉगिन</h3>
<input type="password" id="pass">
<button onclick="login()">लॉगिन</button>
</div>

<div class="box hidden" id="adminPanel">

<h2>📋 सभी प्रोफाइल</h2>

<button onclick="toggleFilters()">🔎 फ़िल्टर दिखाएँ</button>

<div id="filters" class="filterBar hidden">

<input id="f_min" placeholder="न्यूनतम उम्र">
<input id="f_max" placeholder="अधिकतम उम्र">
<input id="f_caste" placeholder="जाति">
<input id="f_religion" placeholder="धर्म">
<input id="f_job" placeholder="नौकरी">
<input id="f_city" placeholder="शहर">
<input id="f_income" placeholder="आय">

<button onclick="loadData()">लागू करें</button>
</div>

<div id="list"></div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAKzX_8a1DYc6HWjOrh56CQ11u_OKAhdSo",
  authDomain: "marriage-cca5c.firebaseapp.com",
  projectId: "marriage-cca5c",
  storageBucket: "marriage-cca5c.firebasestorage.app",
  messagingSenderId: "773647448906",
  appId: "1:773647448906:web:11b71eac4ac888c7e7dfb3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const IMGBB_API_KEY = "bda75eb2720137e8a44b17808dae3b76";
const ADMIN_PASS = "12345";

/* ADMIN */
function openAdmin(){
  document.getElementById("formBox").style.display = "none";
  loginBox.classList.remove("hidden");
}

function login(){
  if(pass.value === ADMIN_PASS){
    loginBox.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    loadData();
  } else {
    alert("गलत पासवर्ड");
  }
}

function toggleFilters(){
  filters.classList.toggle("hidden");
}

/* SUBMIT */
async function submitData(){

  try{

    let imgURL = "";
    let file = image.files[0];

    if(file){

      const formData = new FormData();
      formData.append("image", file);

      const response = await fetch(
        "https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY,
        {
          method:"POST",
          body:formData
        }
      );

      const data = await response.json();

      if(data.success){
        imgURL = data.data.url;
      }
    }

    await db.collection("बायोडाटा").add({

      नाम:name.value,
      उम्र:age.value,
      लिंग:gender.value,
      स्थिति:status.value,

      जन्मतिथि:dob.value,
      ऊँचाई:height.value,
      वजन:weight.value,

      मोबाइल:mobile.value,
      शहर:city.value,
      राज्य:state.value,

      धर्म:religion.value,
      जाति:caste.value,

      शिक्षा:education.value,

      नौकरी_प्रकार:jobType.value,
      नौकरी:job.value,
      आय:income.value,

      पिता:father.value,
      माता:mother.value,
      भाईबहन:siblings.value,
      परिवार:familyType.value,

      पसंद_उम्र:prefAge.value,
      पसंद_ऊँचाई:prefHeight.value,
      पसंद_जाति:prefCaste.value,
      पसंद_धर्म:prefReligion.value,
      पसंद_नौकरी:prefJob.value,
      पसंद_शहर:prefCity.value,
      पसंद_आय:prefIncome.value,

      फोटो:imgURL,
      समय:Date.now()

    });

    alert("सफलतापूर्वक जमा हुआ ✅");

  }catch(err){
    console.error(err);
    alert("अपलोड फेल ❌");
  }
}

/* LOAD */
function loadData(){

  db.collection("बायोडाटा").get().then(snap=>{

    list.innerHTML="";

    let min=parseInt(f_min.value||0);
    let max=parseInt(f_max.value||100);

    snap.forEach(doc=>{
      let d=doc.data();
      let age=parseInt(d.उम्र||0);

      if(
        age>=min &&
        age<=max &&
        (!f_caste.value || d.जाति.includes(f_caste.value)) &&
        (!f_job.value || d.नौकरी.includes(f_job.value)) &&
        (!f_city.value || d.शहर.includes(f_city.value))
      ){

        list.innerHTML+=`
        <div class="card">
          <img src="${d.फोटो}">
          <h3>${d.नाम}</h3>
          <p>उम्र: ${d.उम्र}</p>
          <p>जाति: ${d.जाति}</p>
          <p>शहर: ${d.शहर}</p>
          <p>नौकरी: ${d.नौकरी}</p>
        </div>
        `;
      }
    });
  });
}

</script>

</body>
</html>
