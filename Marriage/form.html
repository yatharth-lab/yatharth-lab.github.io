<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#FF8C00">
    <title>Submit Biodata - Vivah Sutra 💑</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,#fff7e0,#fff);min-height:100vh;padding:15px}
        .container{max-width:500px;margin:0 auto;background:#fff;padding:22px;border-radius:20px;box-shadow:0 10px 30px rgba(255,140,0,0.15);border:2px solid #FFB300}
        h2{text-align:center;color:#FF6F00;margin-bottom:3px;font-size:1.4rem}
        .sub{text-align:center;color:#888;font-size:.8rem;margin-bottom:15px}
        label{font-weight:700;font-size:.75rem;color:#FF6F00;display:block;margin:8px 0 3px}
        input,select,textarea{width:100%;padding:10px;border:2px solid #ffe0b2;border-radius:10px;font-size:.9rem;outline:none;background:#fffdf7;font-family:inherit}
        input:focus,select:focus,textarea:focus{border-color:#FF8C00}
        button{width:100%;padding:15px;background:linear-gradient(135deg,#FF8C00,#FFB300);color:#fff;border:none;border-radius:12px;font-size:1.1rem;font-weight:700;margin-top:15px;cursor:pointer}
        button:active{transform:scale(.97)}
        #msg{text-align:center;margin-top:12px;font-weight:700;font-size:.9rem}
        .note{text-align:center;font-size:.7rem;color:#aaa;margin-top:12px}
        .photo-section{text-align:center;margin-bottom:15px}
        .photo-section label{font-weight:700;color:#FF6F00;display:block;margin-bottom:5px;font-size:.85rem}
        #photoPreview{width:100%;aspect-ratio:9/16;max-height:250px;background:#fff7e0;border:3px dashed #FFB300;border-radius:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
        #photoPreview img{width:100%;height:100%;object-fit:cover}
        #photoPreview span{font-size:2rem;color:#aaa}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .full{grid-column:1/-1}
    </style>
</head>
<body>
    <div class="container">
        <h2>💑 Vivah Sutra</h2>
        <p class="sub">Submit Your Biodata</p>
        
        <form onsubmit="submitBiodata(event)">
            <!-- PHOTO -->
            <div class="photo-section">
                <label>📸 Profile Photo</label>
                <div id="photoPreview" onclick="document.getElementById('photoInput').click()">
                    <span>📷 Tap to select</span>
                </div>
                <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="previewPhoto(event)">
            </div>
            
            <div class="row">
                <div><label>👤 Full Name *</label><input type="text" id="name" required></div>
                <div><label>⚧ Gender *</label><select id="gender" required><option value="">Select</option><option>Groom</option><option>Bride</option></select></div>
                <div><label>🎂 Age *</label><input type="number" id="age" required min="18" max="60"></div>
                <div><label>📏 Height</label><input type="text" id="height" placeholder="5'8''"></div>
                <div><label>⚖️ Weight</label><input type="text" id="weight" placeholder="70 kg"></div>
                <div><label>💍 Status</label><select id="marital"><option value="">Select</option><option>Never Married</option><option>Divorced</option><option>Widowed</option></select></div>
                <div><label>🕉️ Gotra</label><input type="text" id="gotra" placeholder="Kashyap"></div>
                <div><label>👨 Father</label><input type="text" id="father"></div>
                <div><label>👩 Mother</label><input type="text" id="mother"></div>
                <div><label>💼 Profession *</label><input type="text" id="profession" required></div>
                <div><label>📍 Location *</label><input type="text" id="location" required></div>
                <div><label>👥 Community *</label><input type="text" id="community" required></div>
                <div><label>📞 Mobile</label><input type="tel" id="mobile" placeholder="9876543210"></div>
                <div><label>🎓 Education</label><input type="text" id="education"></div>
                <div><label>💰 Income</label><input type="text" id="income" placeholder="10 LPA"></div>
                <div class="full"><label>📝 About</label><textarea id="about" rows="3" placeholder="Brief description..."></textarea></div>
            </div>
            
            <button type="submit">📤 Submit Biodata</button>
        </form>
        <div id="msg"></div>
        <p class="note">🔒 Your data is safe & private</p>
    </div>

    <script>
        let photoData = null;
        
        function previewPhoto(e) {
            const f = e.target.files[0];
            if (!f) return;
            if (f.size > 5*1024*1024) { alert('Max 5MB'); return; }
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ratio = 400 / img.width;
                    canvas.width = 400;
                    canvas.height = img.height * ratio;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    photoData = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('photoPreview').innerHTML = `<img src="${photoData}">`;
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(f);
        }
        
        async function submitBiodata(e) {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.style.color = '#FF8C00';
            msg.textContent = '⏳ Submitting...';
            
            // ⚠️ ⚠️ ⚠️ YEH TEEN CHEEZEIN APNI DAALO ⚠️ ⚠️ ⚠️
            const TOKEN = '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';
            const OWNER = 'yatharth-lab;
            const REPO = 'vivah-profiles';
            
            const data = {
                id: Date.now(),
                name: document.getElementById('name').value,
                gender: document.getElementById('gender').value,
                age: parseInt(document.getElementById('age').value),
                height: document.getElementById('height').value || '',
                weight: document.getElementById('weight').value || '',
                maritalStatus: document.getElementById('marital').value || '',
                gotra: document.getElementById('gotra').value || '',
                fatherName: document.getElementById('father').value || '',
                motherName: document.getElementById('mother').value || '',
                profession: document.getElementById('profession').value,
                location: document.getElementById('location').value,
                community: document.getElementById('community').value,
                mobile: document.getElementById('mobile').value || '',
                education: document.getElementById('education').value || '',
                income: document.getElementById('income').value || '',
                about: document.getElementById('about').value || '',
                image: photoData,
                createdAt: new Date().toISOString()
            };
            
            const title = `👤 ${data.name}, ${data.age} - ${data.profession} (${data.location})`;
            
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${TOKEN}`,
                        'Content-Type': 'application/json',
                        'User-Agent': 'VivahSutra'
                    },
                    body: JSON.stringify({ title: title, body: JSON.stringify(data), labels: ['biodata'] })
                });
                
                if (res.ok) {
                    msg.style.color = 'green';
                    msg.textContent = '✅ Biodata Submitted Successfully!';
                    e.target.reset();
                    document.getElementById('photoPreview').innerHTML = '<span>📷 Tap to select</span>';
                    photoData = null;
                } else {
                    throw new Error('Failed');
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.textContent = '❌ Error. Please try again.';
            }
        }
    </script>
</body>
</html>
