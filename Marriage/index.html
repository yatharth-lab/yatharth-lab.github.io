<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#FF8C00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vivah Sutra">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' rx='40' fill='%23FF8C00'/><text x='100' y='130' font-size='110' text-anchor='middle'>💑</text></svg>">
    <link rel="manifest" href="manifest.json">
    <title>Vivah Sutra 💑</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- SPLASH -->
    <div id="splashScreen">
        <div class="splash-icon">💑</div>
        <h2>Vivah Sutra</h2>
        <p>Loading...</p>
    </div>

    <!-- TOP BAR -->
    <nav id="topNav">
        <div class="nav-inner">
            <div class="nav-logo">💑 Vivah Sutra</div>
            <div class="nav-btns">
                <button onclick="showPage('home')" id="nav-home" class="nav-btn active">🏠 Home</button>
                <button onclick="showPage('add')" id="nav-add" class="nav-btn">➕ Add</button>
                <button onclick="showPage('backup')" id="nav-backup" class="nav-btn">💾 Backup</button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- HOME PAGE -->
        <div id="page-home" class="page active-page">
            <div class="stats-row">
                <div class="stat-box"><span id="totalProfiles">0</span><br>Total</div>
                <div class="stat-box"><span id="groomCount">0</span><br>🤵 Groom</div>
                <div class="stat-box"><span id="brideCount">0</span><br>👰 Bride</div>
            </div>

            <!-- SEARCH BAR -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search by name, community..." oninput="doSearch()">
            </div>

            <!-- FILTER ROW -->
            <div class="filter-row">
                <select id="filterGender" onchange="doSearch()">
                    <option value="">All Gender</option>
                    <option value="Groom">🤵 Groom</option>
                    <option value="Bride">👰 Bride</option>
                </select>
                <button onclick="clearSearch()" class="clear-btn">✕ Clear</button>
            </div>

            <!-- PROFILE GRID -->
            <div id="profileGrid" class="profile-grid"></div>
        </div>

        <!-- ADD PAGE -->
        <div id="page-add" class="page">
            <h2 class="page-title">➕ Add New Profile</h2>
            <form id="profileForm" class="add-form" onsubmit="return false;">
                
                <!-- PHOTO -->
                <div class="photo-section">
                    <label>📸 Profile Photo</label>
                    <div id="photoPreview" onclick="document.getElementById('photoInput').click()">
                        <span>📷 Tap to select</span>
                    </div>
                    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)">
                    <button type="button" id="cropBtn" class="crop-btn" style="display:none" onclick="openCrop()">✂️ Edit</button>
                </div>

                <!-- FORM FIELDS -->
                <div class="form-grid">
                    <div class="fg"><label>👤 Name *</label><input type="text" id="fName" required></div>
                    <div class="fg"><label>⚧ Gender *</label><select id="fGender" required><option value="">Select</option><option value="Groom">🤵 Groom</option><option value="Bride">👰 Bride</option></select></div>
                    <div class="fg"><label>🎂 Age *</label><input type="number" id="fAge" required min="18" max="60"></div>
                    <div class="fg"><label>📏 Height</label><input type="text" id="fHeight" placeholder="5'8''"></div>
                    <div class="fg"><label>⚖️ Weight</label><input type="text" id="fWeight" placeholder="70 kg"></div>
                    <div class="fg"><label>💍 Marital Status</label><select id="fMarital"><option value="">Select</option><option>Never Married</option><option>Divorced</option><option>Widowed</option></select></div>
                    <div class="fg"><label>🕉️ Gotra</label><input type="text" id="fGotra" placeholder="Kashyap"></div>
                    <div class="fg"><label>👨 Father's Name</label><input type="text" id="fFather" placeholder="Father's name"></div>
                    <div class="fg"><label>👩 Mother's Name</label><input type="text" id="fMother" placeholder="Mother's name"></div>
                    <div class="fg"><label>💼 Profession *</label><input type="text" id="fProfession" required></div>
                    <div class="fg"><label>📍 Location *</label><input type="text" id="fLocation" required></div>
                    <div class="fg"><label>👥 Community *</label><input type="text" id="fCommunity" required></div>
                    <div class="fg"><label>📞 Mobile</label><input type="tel" id="fMobile"></div>
                    <div class="fg"><label>🎓 Education</label><input type="text" id="fEducation"></div>
                    <div class="fg"><label>💰 Income</label><input type="text" id="fIncome"></div>
                    <div class="fg full"><label>📝 About</label><textarea id="fAbout" rows="3"></textarea></div>
                </div>
                <div class="form-actions">
                    <button type="submit" onclick="saveProfile()" class="btn-save">💾 Save</button>
                    <button type="button" onclick="resetForm()" class="btn-reset">🔄 Reset</button>
                </div>
            </form>
        </div>

        <!-- BACKUP PAGE -->
        <div id="page-backup" class="page">
            <h2 class="page-title">💾 Backup & Restore</h2>
            <div class="backup-cards">
                <div class="b-card" onclick="downloadBackup()">
                    <span class="b-icon">📥</span>
                    <h3>Download Backup</h3>
                    <p>Save all data + images</p>
                </div>
                <div class="b-card" onclick="document.getElementById('restoreFile').click()">
                    <span class="b-icon">📤</span>
                    <h3>Restore Backup</h3>
                    <p>Upload JSON file</p>
                    <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreBackup(event)">
                </div>
            </div>
            <button onclick="clearAllData()" class="btn-danger-full">🗑️ Clear All Data</button>
        </div>
    </div>

    <!-- IMAGE VIEWER -->
    <div id="imageViewer" onclick="closeImageViewer()">
        <img id="fullImage" onclick="event.stopPropagation()">
        <button class="close-viewer" onclick="closeImageViewer()">✕</button>
    </div>

    <!-- CROP MODAL -->
    <div id="cropModal">
        <div class="crop-inner">
            <h3>✂️ Crop (9:16)</h3>
            <div class="crop-box"><img id="cropImage"></div>
            <div class="crop-btns">
                <button onclick="doCrop()" class="btn-crop-done">✅ Done</button>
                <button onclick="closeCrop()" class="btn-crop-cancel">❌ Cancel</button>
            </div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div id="detailModal"></div>

    <!-- INSTALL BANNER -->
    <div id="installBanner">
        <span>📱 Install this app</span>
        <button onclick="installApp()">Install</button>
        <button onclick="this.parentElement.style.display='none'">Later</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
