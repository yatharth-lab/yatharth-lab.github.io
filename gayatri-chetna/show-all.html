<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#f28c00"
>

<meta
  name="description"
  content="गायत्री चेतना केन्द्र पंजीकरण सूची"
>

<link
  rel="manifest"
  href="manifest.json"
>

<title>गायत्री चेतना केन्द्र — पंजीकरण</title>


<style>

/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:
    "Noto Sans Devanagari",
    "Nirmala UI",
    "Mangal",
    "Segoe UI",
    sans-serif;

  background:#fff8ed;
  color:#4b2b0b;

  overflow-x:hidden;
}

img{
  max-width:100%;
}

button,
input{
  font-family:inherit;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  width:100% !important;
  min-height:72px;

  background:
    linear-gradient(
      135deg,
      #f28c00 0%,
      #ffb52e 100%
    ) !important;

  color:#fff !important;

  padding:12px !important;

  display:flex !important;
  align-items:center !important;

  gap:10px !important;

  position:relative;

  box-shadow:
    0 2px 8px rgba(0,0,0,.15);

  overflow:hidden;
}

.header img{
  width:48px !important;
  height:48px !important;

  min-width:48px !important;
  max-width:48px !important;

  min-height:48px !important;
  max-height:48px !important;

  display:block !important;

  object-fit:contain !important;

  background:#fff !important;

  border-radius:50% !important;

  padding:4px !important;

  flex:0 0 48px !important;
}

.header-text{
  flex:1 1 auto !important;

  min-width:0 !important;

  overflow:hidden;
}

.header-text h1{
  font-size:18px;

  line-height:1.3;

  font-weight:700;

  color:#fff;

  white-space:normal;
}

.header-text p{
  font-size:11px;

  line-height:1.4;

  margin-top:2px;

  color:#fff;
}


/* =========================================================
   MAIN
========================================================= */

.container{
  width:100%;

  max-width:850px;

  margin:0 auto;

  padding:12px;
}


/* =========================================================
   LOGIN
========================================================= */

.login-box{
  width:100%;

  background:#fff;

  border:1px solid #ecd3ae;

  border-radius:12px;

  padding:15px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.07);

  margin-top:10px;
}

.login-title{
  text-align:center;

  color:#d86f00;

  font-size:20px;

  line-height:1.4;

  margin-bottom:5px;
}

.login-subtitle{
  text-align:center;

  color:#80684c;

  font-size:12px;

  line-height:1.5;

  margin-bottom:15px;
}


/* =========================================================
   INPUT
========================================================= */

.field{
  margin-bottom:11px;
}

.field label{
  display:block;

  font-size:12px;

  margin-bottom:4px;

  color:#704d2b;
}

.field input{
  width:100%;

  padding:10px;

  border:1px solid #dfc49f;

  border-radius:8px;

  outline:none;

  font-size:14px;

  background:#fffdfa;

  color:#422a12;
}

.field input:focus{
  border-color:#f28c00;

  box-shadow:
    0 0 0 2px rgba(242,140,0,.10);
}


/* =========================================================
   BUTTON
========================================================= */

.button{
  width:100%;

  border:0;

  border-radius:8px;

  padding:11px;

  background:#f28c00;

  color:#fff;

  font-size:14px;

  cursor:pointer;

  transition:.15s;
}

.button:active{
  transform:scale(.99);
}

.button:disabled{
  opacity:.6;

  cursor:not-allowed;
}


/* =========================================================
   ERROR
========================================================= */

.login-error,
.error{
  display:none;

  margin-top:10px;

  padding:9px;

  border-radius:8px;

  background:#fff0f0;

  border:1px solid #e5aaaa;

  color:#a52d2d;

  font-size:12px;

  line-height:1.5;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  width:100%;

  display:flex;

  gap:7px;

  align-items:center;

  margin-bottom:10px;

  flex-wrap:wrap;
}

.search{
  flex:1 1 180px;

  min-width:180px;

  padding:10px;

  border:1px solid #dfc49f;

  border-radius:8px;

  outline:none;

  background:#fff;

  color:#422a12;

  font-size:13px;
}

.search:focus{
  border-color:#f28c00;
}

.sync-button{
  border:0;

  background:#f28c00;

  color:#fff;

  border-radius:8px;

  padding:9px 12px;

  font-size:12px;

  cursor:pointer;

  white-space:nowrap;
}

.sync-button:disabled{
  opacity:.6;

  cursor:not-allowed;
}

.logout{
  border:1px solid #e0bd8b;

  background:#fff;

  color:#a75e0b;

  border-radius:8px;

  padding:9px 10px;

  font-size:11px;

  cursor:pointer;

  white-space:nowrap;
}


/* =========================================================
   SYNC MESSAGE
========================================================= */

.sync-note{
  margin:8px 0;

  padding:8px 10px;

  border-radius:8px;

  background:#fff3dc;

  border:1px solid #efd09d;

  color:#795324;

  font-size:11px;

  line-height:1.5;
}


/* =========================================================
   LIST
========================================================= */

.list{
  width:100%;

  display:flex;

  flex-direction:column;

  gap:7px;
}

.registration{
  width:100%;

  background:#fff;

  border:1px solid #ecd8bc;

  border-radius:9px;

  padding:7px;

  display:flex;

  align-items:center;

  gap:9px;

  cursor:pointer;

  box-shadow:
    0 1px 4px rgba(0,0,0,.05);

  transition:
    transform .15s,
    border-color .15s;
}

.registration:active{
  transform:scale(.99);
}


/* =========================================================
   THUMBNAIL
========================================================= */

.thumb{
  width:50px !important;
  height:50px !important;

  min-width:50px !important;
  max-width:50px !important;

  min-height:50px !important;
  max-height:50px !important;

  display:block !important;

  object-fit:cover !important;

  flex:0 0 50px !important;

  border-radius:7px;

  background:#f4e7d3;

  overflow:hidden;
}


/* =========================================================
   BASIC
========================================================= */

.basic{
  min-width:0;

  flex:1 1 auto;

  overflow:hidden;
}

.name{
  font-size:14px;

  font-weight:700;

  line-height:1.4;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  color:#4b2b0b;
}

.place{
  font-size:11px;

  color:#80684c;

  margin-top:2px;

  line-height:1.4;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.regid{
  font-size:9px;

  color:#a06c2e;

  margin-top:2px;

  line-height:1.3;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================================================
   ARROW
========================================================= */

.arrow{
  flex:0 0 auto;

  font-size:20px;

  line-height:1;

  color:#f28c00;

  padding:3px;
}


/* =========================================================
   ID CARD BUTTON
========================================================= */

.make-card{
  flex:0 0 auto;

  border:0;

  background:#f28c00;

  color:#fff;

  border-radius:6px;

  padding:6px 10px;

  font-size:10px;

  font-weight:700;

  cursor:pointer;

  white-space:nowrap;
}

.make-card:active{
  background:#d87a00;
}


/* =========================================================
   STATUS
========================================================= */

.status{
  width:100%;

  text-align:center;

  padding:25px 10px;

  font-size:13px;

  line-height:1.5;

  color:#765532;

  background:#fff;

  border-radius:10px;

  border:1px solid #ecd8bc;
}


/* =========================================================
   NO PHOTO
========================================================= */

.no-photo{
  width:50px !important;
  height:50px !important;

  min-width:50px !important;
  max-width:50px !important;

  min-height:50px !important;
  max-height:50px !important;

  display:flex !important;

  align-items:center !important;
  justify-content:center !important;

  flex:0 0 50px !important;

  border-radius:7px;

  background:#f4e7d3;

  color:#a58b6e;

  font-size:9px;

  line-height:1.3;

  text-align:center;
}


/* =========================================================
   DETAIL
========================================================= */

.detail{
  display:none;

  width:100%;
}

.back{
  border:0;

  background:#f28c00;

  color:#fff;

  border-radius:7px;

  padding:8px 12px;

  font-size:12px;

  margin-bottom:10px;

  cursor:pointer;
}

.detail-card{
  width:100%;

  background:#fff;

  border:1px solid #ecd3ae;

  border-radius:12px;

  padding:15px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.07);
}


/* =========================================================
   DETAIL PHOTO
========================================================= */

.detail-photo{
  width:100%;

  text-align:center;

  margin-bottom:10px;
}

.detail-photo img{
  width:150px !important;
  height:175px !important;

  min-width:150px !important;
  max-width:150px !important;

  min-height:175px !important;
  max-height:175px !important;

  display:inline-block !important;

  object-fit:cover !important;

  background:#f4e7d3;

  border-radius:9px;

  border:2px solid #f1bd70;
}

.detail-no-photo{
  text-align:center;

  padding:30px;

  color:#8b6a49;
}


/* =========================================================
   DETAIL TITLE
========================================================= */

.detail-title{
  text-align:center;

  font-size:18px;

  line-height:1.4;

  color:#d86f00;

  margin-bottom:3px;
}

.detail-registration-id,
.detail-id{
  text-align:center;

  font-size:10px;

  color:#856747;

  margin-bottom:10px;
}


/* =========================================================
   DETAIL ROW
========================================================= */

.detail-row,
.row{
  border-bottom:1px solid #f0e2cf;

  padding:8px 2px;
}

.row:last-child{
  border-bottom:0;
}

.detail-label,
.label{
  font-size:10px;

  color:#8b6a49;

  margin-bottom:2px;
}

.detail-value,
.value{
  font-size:13px;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;

  color:#422a12;
}


/* =========================================================
   SECTION
========================================================= */

.section-title{
  color:#d86f00;

  font-size:15px;

  line-height:1.4;

  margin-top:14px;

  margin-bottom:4px;
}


/* =========================================================
   MAIN BUTTON
========================================================= */

.main-button{
  width:100%;

  border:0;

  border-radius:8px;

  padding:12px;

  background:#f28c00;

  color:#fff;

  font-size:14px;

  font-weight:700;

  cursor:pointer;

  margin-top:15px;
}


/* =========================================================
   CROP MODAL
========================================================= */

.crop-modal{
  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  background:rgba(0,0,0,.88);

  z-index:99999;

  display:none;

  align-items:center;
  justify-content:center;

  padding:12px;

  overscroll-behavior:contain;
}

.crop-modal.open{
  display:flex;
}

.crop-panel{
  width:min(900px, 100%);

  max-height:96vh;

  overflow:auto;

  background:#fff;

  border-radius:18px;

  padding:15px;

  box-shadow:
    0 15px 50px rgba(0,0,0,.4);
}

.crop-title{
  text-align:center;

  color:#4b2b0b;

  font-size:18px;

  font-weight:700;

  margin-bottom:5px;
}

.crop-subtitle{
  text-align:center;

  color:#80684c;

  font-size:11px;

  margin-bottom:12px;
}


/* =========================================================
   CROP WORKSPACE
========================================================= */

.crop-workspace{
  width:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#111;

  border-radius:12px;

  overflow:hidden;

  min-height:200px;

  touch-action:none;

  user-select:none;

  -webkit-user-select:none;
}

.crop-image-wrap{
  position:relative;

  display:block;

  line-height:0;

  max-width:100%;

  max-height:65vh;

  overflow:hidden;

  touch-action:none;
}

.crop-image{
  display:block;

  width:auto;

  height:auto;

  max-width:100%;

  max-height:65vh;

  user-select:none;

  -webkit-user-drag:none;

  pointer-events:none;
}


/* =========================================================
   CROP OVERLAY
========================================================= */

.crop-overlay{
  position:absolute;

  inset:0;

  pointer-events:none;
}

.crop-shade{
  position:absolute;

  inset:0;

  background:rgba(0,0,0,.58);

  pointer-events:none;
}

.crop-selection{
  position:absolute;

  border:3px solid #f28c00;

  background:transparent;

  box-shadow:
    0 0 0 99999px rgba(0,0,0,.58);

  cursor:move;

  pointer-events:auto;

  touch-action:none;

  z-index:5;
}

.crop-selection::before{
  content:"";

  position:absolute;

  inset:0;

  border:1px solid rgba(255,255,255,.7);

  pointer-events:none;
}

.crop-selection::after{
  content:"";

  position:absolute;

  left:50%;
  top:50%;

  width:20px;
  height:20px;

  transform:translate(-50%,-50%);

  border:
    2px solid rgba(255,255,255,.8);

  border-radius:50%;

  pointer-events:none;
}

.crop-corners{
  position:absolute;

  inset:-3px;

  pointer-events:none;
}

.crop-corners span{
  position:absolute;

  width:15px;
  height:15px;

  border-color:#fff;

  border-style:solid;
}

.crop-corners .tl{
  left:-2px;
  top:-2px;

  border-width:3px 0 0 3px;
}

.crop-corners .tr{
  right:-2px;
  top:-2px;

  border-width:3px 3px 0 0;
}

.crop-corners .bl{
  left:-2px;
  bottom:-2px;

  border-width:0 0 3px 3px;
}

.crop-corners .br{
  right:-2px;
  bottom:-2px;

  border-width:0 3px 3px 0;
}


/* =========================================================
   CROP INFO
========================================================= */

.crop-info{
  text-align:center;

  color:#6d5135;

  font-size:11px;

  line-height:1.5;

  margin-top:10px;
}

.crop-info strong{
  color:#d86f00;
}


/* =========================================================
   CROP BUTTONS
========================================================= */

.crop-buttons{
  display:flex;

  justify-content:center;

  gap:9px;

  margin-top:13px;

  flex-wrap:wrap;
}

.crop-cancel{
  border:0;

  background:#e8e8e8;

  color:#333;

  padding:10px 20px;

  border-radius:24px;

  font-size:13px;

  cursor:pointer;
}

.crop-confirm{
  border:0;

  background:#f28c00;

  color:#fff;

  padding:10px 20px;

  border-radius:24px;

  font-size:13px;

  font-weight:700;

  cursor:pointer;
}

.crop-confirm:disabled{
  opacity:.6;

  cursor:not-allowed;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

  .header{
    min-height:68px;

    padding:10px !important;

    gap:8px !important;
  }

  .header img{
    width:44px !important;
    height:44px !important;

    min-width:44px !important;
    max-width:44px !important;

    min-height:44px !important;
    max-height:44px !important;

    flex-basis:44px !important;
  }

  .header-text h1{
    font-size:15px;
  }

  .header-text p{
    font-size:9px;
  }

  .container{
    padding:10px;
  }

  .registration{
    gap:7px;
  }

  .thumb,
  .no-photo{
    width:46px !important;
    height:46px !important;

    min-width:46px !important;
    max-width:46px !important;

    min-height:46px !important;
    max-height:46px !important;

    flex-basis:46px !important;
  }

  .name{
    font-size:13px;
  }

  .place{
    font-size:10px;
  }

  .regid{
    font-size:8px;
  }

  .arrow{
    font-size:18px;
  }

  .make-card{
    padding:5px 8px;

    font-size:9px;
  }

  .crop-modal{
    padding:7px;
  }

  .crop-panel{
    padding:10px;

    border-radius:14px;
  }

  .crop-title{
    font-size:16px;
  }

  .crop-subtitle{
    font-size:10px;
  }

  .crop-image-wrap{
    max-height:62vh;
  }

  .crop-image{
    max-height:62vh;
  }

  .crop-buttons{
    gap:7px;
  }

  .crop-cancel,
  .crop-confirm{
    padding:9px 14px;

    font-size:12px;
  }

}


/* =========================================================
   VERY SMALL
========================================================= */

@media(max-width:360px){

  .header-text h1{
    font-size:14px;
  }

  .header-text p{
    font-size:8px;
  }

  .search{
    min-width:150px;
  }

  .make-card{
    font-size:8px;

    padding:4px 6px;
  }

}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  .container{
    padding:18px;
  }

  .registration:hover{
    border-color:#efb35b;

    transform:translateY(-1px);
  }

  .make-card:hover{
    background:#d87a00;
  }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

button:focus-visible,
input:focus-visible{
  outline:
    2px solid #f28c00;

  outline-offset:2px;
}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

  <img
    src="logo.png"
    alt="गायत्री चेतना केन्द्र लोगो"
    id="siteLogo"
  >

  <div class="header-text">

    <h1>
      गायत्री चेतना केन्द्र चिलबिला, प्रतापगढ़
    </h1>

    <p>
      अखिल विश्व गायत्री परिवार, शान्तिकुञ्ज, हरिद्वार
    </p>

  </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">


<!-- =========================================================
     LOGIN
========================================================= -->

<section
  id="loginView"
  class="login-box"
>

  <h2 class="login-title">
    पंजीकरण सूची खोलें
  </h2>

  <p class="login-subtitle">
    निजी GitHub Repository से पंजीकरण डेटा देखने के लिए विवरण भरें।
  </p>


  <div class="field">

    <label for="username">
      GitHub उपयोगकर्ता नाम
    </label>

    <input
      id="username"
      type="text"
      autocomplete="username"
      placeholder="GitHub username"
    >

  </div>


  <div class="field">

    <label for="repo">
      निजी Repository का नाम
    </label>

    <input
      id="repo"
      type="text"
      placeholder="Repository name"
    >

  </div>


  <div class="field">

    <label for="token">
      GitHub Token
    </label>

    <input
      id="token"
      type="password"
      autocomplete="current-password"
      placeholder="GitHub token"
    >

  </div>


  <button
    id="loginButton"
    class="button"
    type="button"
  >
    सुरक्षित रूप से खोलें
  </button>


  <div
    id="loginError"
    class="login-error"
  ></div>

</section>


<!-- =========================================================
     LIST
========================================================= -->

<section
  id="listView"
  style="display:none"
>

  <div class="topbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="नाम, पंजीकरण क्रमांक, स्थान, मोबाइल खोजें..."
    >


    <button
      id="refreshButton"
      class="sync-button"
      type="button"
    >
      ↻ सिंक
    </button>


    <button
      id="logoutButton"
      class="logout"
      type="button"
    >
      बाहर निकलें
    </button>

  </div>


  <div
    id="syncBox"
    class="sync-note"
    style="display:none"
  ></div>


  <div
    id="registrationList"
    class="list"
  ></div>

</section>


<!-- =========================================================
     DETAIL
========================================================= -->

<section
  id="detailView"
  class="detail"
>

  <button
    id="backButton"
    class="back"
    type="button"
  >
    ← वापस
  </button>


  <div
    id="detailCard"
    class="detail-card"
  ></div>

</section>


</main>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="show-all.js?v=99"></script>

</body>

</html>
