<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#f28c00"
>

<meta
  name="description"
  content="गायत्री चेतना केन्द्र पंजीकरण सूची"
>

<link
  rel="manifest"
  href="manifest.json"
>

<title>गायत्री चेतना केन्द्र — पंजीकरण</title>


<style>

/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:
    "Noto Sans Devanagari",
    "Nirmala UI",
    "Mangal",
    "Segoe UI",
    sans-serif;

  background:#fff8ed;
  color:#4b2b0b;

  overflow-x:hidden;
}

img{
  max-width:100%;
}

button,
input{
  font-family:inherit;
}


/* =========================================================
   HEADER / ORANGE STRIP
========================================================= */

.header{
  width:100% !important;
  min-height:72px;

  background:
    linear-gradient(
      135deg,
      #f28c00 0%,
      #ffb52e 100%
    ) !important;

  color:#fff !important;

  padding:12px !important;

  display:flex !important;
  align-items:center !important;

  gap:10px !important;

  position:relative;

  box-shadow:
    0 2px 8px rgba(0,0,0,.15);

  overflow:hidden;
}


/* HEADER LOGO */

.header img{
  width:48px !important;
  height:48px !important;

  min-width:48px !important;
  max-width:48px !important;

  min-height:48px !important;
  max-height:48px !important;

  display:block !important;

  object-fit:contain !important;

  background:#fff !important;

  border-radius:50% !important;

  padding:4px !important;

  flex:0 0 48px !important;
}


/* HEADER TEXT */

.header-text{
  flex:1 1 auto !important;

  min-width:0 !important;

  overflow:hidden;
}

.header-text h1{
  font-size:18px;

  line-height:1.3;

  font-weight:700;

  color:#fff;

  white-space:normal;
}

.header-text p{
  font-size:11px;

  line-height:1.4;

  margin-top:2px;

  color:#fff;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
  width:100%;

  max-width:850px;

  margin:0 auto;

  padding:12px;
}


/* =========================================================
   LOGIN
========================================================= */

.login-box{
  width:100%;

  background:#fff;

  border:
    1px solid #ecd3ae;

  border-radius:12px;

  padding:15px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.07);

  margin-top:10px;
}

.login-title{
  text-align:center;

  color:#d86f00;

  font-size:20px;

  line-height:1.4;

  margin-bottom:5px;
}

.login-subtitle{
  text-align:center;

  color:#80684c;

  font-size:12px;

  line-height:1.5;

  margin-bottom:15px;
}


/* =========================================================
   INPUT
========================================================= */

.field{
  margin-bottom:11px;
}

.field label{
  display:block;

  font-size:12px;

  margin-bottom:4px;

  color:#704d2b;
}

.field input{
  width:100%;

  padding:10px;

  border:
    1px solid #dfc49f;

  border-radius:8px;

  outline:none;

  font-size:14px;

  background:#fffdfa;

  color:#422a12;
}

.field input:focus{
  border-color:#f28c00;

  box-shadow:
    0 0 0 2px rgba(242,140,0,.10);
}


/* =========================================================
   MAIN BUTTON
========================================================= */

.button{
  width:100%;

  border:0;

  border-radius:8px;

  padding:11px;

  background:#f28c00;

  color:#fff;

  font-size:14px;

  cursor:pointer;

  transition:.15s;
}

.button:active{
  transform:scale(.99);
}

.button:disabled{
  opacity:.6;

  cursor:not-allowed;
}


/* =========================================================
   ERROR
========================================================= */

.login-error,
.error{
  display:none;

  margin-top:10px;

  padding:9px;

  border-radius:8px;

  background:#fff0f0;

  border:
    1px solid #e5aaaa;

  color:#a52d2d;

  font-size:12px;

  line-height:1.5;
}


/* =========================================================
   LIST TOP BAR
========================================================= */

.topbar{
  width:100%;

  display:flex;

  gap:7px;

  align-items:center;

  margin-bottom:10px;

  flex-wrap:wrap;
}

.search{
  flex:1 1 180px;

  min-width:180px;

  padding:10px;

  border:
    1px solid #dfc49f;

  border-radius:8px;

  outline:none;

  background:#fff;

  color:#422a12;

  font-size:13px;
}

.search:focus{
  border-color:#f28c00;
}

.sync-button{
  border:0;

  background:#f28c00;

  color:#fff;

  border-radius:8px;

  padding:9px 12px;

  font-size:12px;

  cursor:pointer;

  white-space:nowrap;
}

.sync-button:disabled{
  opacity:.6;

  cursor:not-allowed;
}

.logout{
  border:
    1px solid #e0bd8b;

  background:#fff;

  color:#a75e0b;

  border-radius:8px;

  padding:9px 10px;

  font-size:11px;

  cursor:pointer;

  white-space:nowrap;
}


/* =========================================================
   SYNC MESSAGE
========================================================= */

.sync-note{
  margin:8px 0;

  padding:8px 10px;

  border-radius:8px;

  background:#fff3dc;

  border:
    1px solid #efd09d;

  color:#795324;

  font-size:11px;

  line-height:1.5;
}


/* =========================================================
   REGISTRATION LIST
========================================================= */

.list{
  width:100%;

  display:flex;

  flex-direction:column;

  gap:7px;
}

.registration{
  width:100%;

  background:#fff;

  border:
    1px solid #ecd8bc;

  border-radius:9px;

  padding:7px;

  display:flex;

  align-items:center;

  gap:9px;

  cursor:pointer;

  box-shadow:
    0 1px 4px rgba(0,0,0,.05);

  transition:
    transform .15s,
    border-color .15s;
}

.registration:active{
  transform:scale(.99);
}


/* =========================================================
   THUMBNAIL
========================================================= */

.thumb{
  width:50px !important;
  height:50px !important;

  min-width:50px !important;
  max-width:50px !important;

  min-height:50px !important;
  max-height:50px !important;

  display:block !important;

  object-fit:cover !important;

  flex:0 0 50px !important;

  border-radius:7px;

  background:#f4e7d3;

  overflow:hidden;
}


/* =========================================================
   BASIC INFO
========================================================= */

.basic{
  min-width:0;

  flex:1 1 auto;

  overflow:hidden;
}

.name{
  font-size:14px;

  font-weight:700;

  line-height:1.4;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  color:#4b2b0b;
}

.place{
  font-size:11px;

  color:#80684c;

  margin-top:2px;

  line-height:1.4;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.regid{
  font-size:9px;

  color:#a06c2e;

  margin-top:2px;

  line-height:1.3;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================================================
   ARROW
========================================================= */

.arrow{
  flex:0 0 auto;

  font-size:20px;

  line-height:1;

  color:#f28c00;

  padding:3px;
}


/* =========================================================
   MAKE CARD BUTTON
========================================================= */

.make-card{
  flex:0 0 auto;

  border:0;

  background:#f28c00;

  color:#fff;

  border-radius:6px;

  padding:6px 10px;

  font-size:10px;

  font-weight:700;

  cursor:pointer;

  white-space:nowrap;

  transition:background .15s;
}

.make-card:active{
  background:#d87a00;
}


/* =========================================================
   STATUS
========================================================= */

.status{
  width:100%;

  text-align:center;

  padding:25px 10px;

  font-size:13px;

  line-height:1.5;

  color:#765532;

  background:#fff;

  border-radius:10px;

  border:
    1px solid #ecd8bc;
}


/* =========================================================
   NO PHOTO
========================================================= */

.no-photo{
  width:50px !important;
  height:50px !important;

  min-width:50px !important;
  max-width:50px !important;

  min-height:50px !important;
  max-height:50px !important;

  display:flex !important;
  align-items:center !important;
  justify-content:center !important;

  flex:0 0 50px !important;

  border-radius:7px;

  background:#f4e7d3;

  color:#a58b6e;

  font-size:9px;

  line-height:1.3;

  text-align:center;
}


/* =========================================================
   DETAIL
========================================================= */

.detail{
  display:none;

  width:100%;
}

.back{
  border:0;

  background:#f28c00;

  color:#fff;

  border-radius:7px;

  padding:8px 12px;

  font-size:12px;

  margin-bottom:10px;

  cursor:pointer;
}

.detail-card{
  width:100%;

  background:#fff;

  border:
    1px solid #ecd3ae;

  border-radius:12px;

  padding:15px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.07);
}


/* =========================================================
   DETAIL PHOTO
========================================================= */

.detail-photo{
  width:100%;

  text-align:center;

  margin-bottom:10px;
}

.detail-photo img{
  width:150px !important;
  height:175px !important;

  min-width:150px !important;
  max-width:150px !important;

  min-height:175px !important;
  max-height:175px !important;

  display:inline-block !important;

  object-fit:contain !important;

  background:#f4e7d3;

  border-radius:9px;

  border:
    2px solid #f1bd70;
}

.detail-no-photo{
  text-align:center;

  padding:30px;

  color:#8b6a49;
}


/* =========================================================
   DETAIL TITLE
========================================================= */

.detail-title{
  text-align:center;

  font-size:18px;

  line-height:1.4;

  color:#d86f00;

  margin-bottom:3px;
}

.detail-registration-id,
.detail-id{
  text-align:center;

  font-size:10px;

  color:#856747;

  margin-bottom:10px;
}


/* =========================================================
   DETAIL ROW
========================================================= */

.detail-row,
.row{
  border-bottom:
    1px solid #f0e2cf;

  padding:8px 2px;
}

.row:last-child{
  border-bottom:0;
}

.detail-label,
.label{
  font-size:10px;

  color:#8b6a49;

  margin-bottom:2px;
}

.detail-value,
.value{
  font-size:13px;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;

  color:#422a12;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title{
  color:#d86f00;

  font-size:15px;

  line-height:1.4;

  margin-top:14px;

  margin-bottom:4px;
}


/* =========================================================
   MAIN BUTTON (Detail View)
========================================================= */

.main-button{
  width:100%;

  border:0;

  border-radius:8px;

  padding:12px;

  background:#f28c00;

  color:#fff;

  font-size:14px;

  font-weight:700;

  cursor:pointer;

  margin-top:15px;

  transition:.15s;
}

.main-button:active{
  transform:scale(.99);
}


/* =========================================================
   CROP MODAL STYLES
========================================================= */

#cropModal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  z-index:9999;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:20px;
}

#cropModal .crop-container{
  background:#fff;
  border-radius:16px;
  padding:20px;
  max-width:90%;
  max-height:90%;
  overflow:auto;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

#cropModal .crop-title{
  text-align:center;
  margin:0 0 15px;
  font-family:'Noto Sans Devanagari',sans-serif;
  color:#4b2b0b;
  font-size:20px;
  font-weight:700;
}

#cropModal .crop-image-wrapper{
  position:relative;
  display:inline-block;
  background:#f0f0f0;
  border-radius:8px;
  overflow:hidden;
  max-width:100%;
}

#cropModal #cropImage{
  max-width:800px;
  max-height:500px;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  width:100%;
  height:auto;
}

#cropModal #cropOverlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#cropModal #cropSelection{
  position:absolute;
  border:3px solid #f28c00;
  box-shadow:0 0 0 9999px rgba(0,0,0,0.5);
  cursor:move;
  display:none;
  box-sizing:border-box;
}

#cropModal #cropSelection .crop-hint{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:#fff;
  font-size:14px;
  text-align:center;
  pointer-events:none;
  opacity:0.9;
  font-family:'Noto Sans Devanagari',sans-serif;
  font-weight:600;
  text-shadow:0 1px 3px rgba(0,0,0,0.5);
}

#cropModal .crop-buttons{
  text-align:center;
  margin-top:15px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

#cropModal .crop-cancel-button{
  background:#e0e0e0;
  color:#333;
  border:none;
  padding:10px 24px;
  border-radius:24px;
  cursor:pointer;
  font-size:15px;
  font-family:'Noto Sans Devanagari',sans-serif;
}

#cropModal .crop-confirm-button{
  background:#f28c00;
  color:#fff;
  border:none;
  padding:10px 24px;
  border-radius:24px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  font-family:'Noto Sans Devanagari',sans-serif;
}

#cropModal .crop-cancel-button:hover{
  background:#d0d0d0;
}

#cropModal .crop-confirm-button:hover{
  background:#d87a00;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

  .header{
    min-height:68px;

    padding:10px !important;

    gap:8px !important;
  }

  .header img{
    width:44px !important;
    height:44px !important;

    min-width:44px !important;
    max-width:44px !important;

    min-height:44px !important;
    max-height:44px !important;

    flex-basis:44px !important;
  }

  .header-text h1{
    font-size:15px;

    line-height:1.3;
  }

  .header-text p{
    font-size:9px;

    line-height:1.3;
  }

  .container{
    padding:10px;
  }

  .registration{
    gap:7px;
  }

  .thumb{
    width:46px !important;
    height:46px !important;

    min-width:46px !important;
    max-width:46px !important;

    min-height:46px !important;
    max-height:46px !important;

    flex-basis:46px !important;
  }

  .no-photo{
    width:46px !important;
    height:46px !important;

    min-width:46px !important;
    max-width:46px !important;

    min-height:46px !important;
    max-height:46px !important;

    flex-basis:46px !important;

    font-size:8px;
  }

  .name{
    font-size:13px;
  }

  .place{
    font-size:10px;
  }

  .regid{
    font-size:8px;
  }

  .arrow{
    font-size:18px;
  }

  .make-card{
    padding:5px 8px;

    font-size:9px;
  }

  .sync-button{
    padding:9px;
  }

  #cropModal .crop-container{
    padding:15px;
  }

  #cropModal .crop-title{
    font-size:17px;
  }

  #cropModal .crop-cancel-button,
  #cropModal .crop-confirm-button{
    padding:8px 16px;
    font-size:13px;
  }

}


/* =========================================================
   TABLET / DESKTOP
========================================================= */

@media(min-width:700px){

  .container{
    padding:18px;
  }

  .registration:hover{
    border-color:#efb35b;

    transform:translateY(-1px);
  }

  .make-card:hover{
    background:#d87a00;
  }

}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media(max-width:360px){

  .header-text h1{
    font-size:14px;
  }

  .header-text p{
    font-size:8px;
  }

  .search{
    min-width:150px;
  }

  .make-card{
    font-size:8px;

    padding:4px 6px;
  }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

button:focus-visible,
input:focus-visible{
  outline:
    2px solid #f28c00;

  outline-offset:2px;
}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

  <img
    src="logo.png"
    alt="गायत्री चेतना केन्द्र लोगो"
    id="siteLogo"
  >

  <div class="header-text">

    <h1>
      गायत्री चेतना केन्द्र चिलबिला, प्रतापगढ़
    </h1>

    <p>
      अखिल विश्व गायत्री परिवार, शान्तिकुञ्ज, हरिद्वार
    </p>

  </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">


<!-- =========================================================
     LOGIN VIEW
========================================================= -->

<section
  id="loginView"
  class="login-box"
>

  <h2 class="login-title">
    पंजीकरण सूची खोलें
  </h2>

  <p class="login-subtitle">
    निजी GitHub Repository से पंजीकरण डेटा देखने के लिए विवरण भरें।
  </p>


  <div class="field">

    <label for="username">
      GitHub उपयोगकर्ता नाम
    </label>

    <input
      id="username"
      type="text"
      autocomplete="username"
      placeholder="GitHub username"
    >

  </div>


  <div class="field">

    <label for="repo">
      निजी Repository का नाम
    </label>

    <input
      id="repo"
      type="text"
      placeholder="Repository name"
    >

  </div>


  <div class="field">

    <label for="token">
      GitHub Token
    </label>

    <input
      id="token"
      type="password"
      autocomplete="current-password"
      placeholder="GitHub token"
    >

  </div>


  <button
    id="loginButton"
    class="button"
    type="button"
  >
    सुरक्षित रूप से खोलें
  </button>


  <div
    id="loginError"
    class="login-error"
  ></div>

</section>


<!-- =========================================================
     LIST VIEW
========================================================= -->

<section
  id="listView"
  style="display:none"
>

  <div class="topbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="नाम, पंजीकरण क्रमांक, स्थान, मोबाइल खोजें..."
    >


    <button
      id="refreshButton"
      class="sync-button"
      type="button"
    >
      ↻ सिंक
    </button>


    <button
      id="logoutButton"
      class="logout"
      type="button"
    >
      बाहर निकलें
    </button>

  </div>


  <div
    id="syncBox"
    class="sync-note"
    style="display:none"
  ></div>


  <div
    id="registrationList"
    class="list"
  ></div>

</section>


<!-- =========================================================
     DETAIL VIEW
========================================================= -->

<section
  id="detailView"
  class="detail"
>

  <button
    id="backButton"
    class="back"
    type="button"
  >
    ← वापस
  </button>


  <div
    id="detailCard"
    class="detail-card"
  ></div>

</section>


</main>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="show-all.js"></script>

</body>

</html>
