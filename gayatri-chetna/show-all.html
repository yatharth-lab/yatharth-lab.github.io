<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#f28c00"
>

<title>
गायत्री चेतना केन्द्र — पंजीकरण
</title>


<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:
    "Noto Sans Devanagari",
    "Segoe UI",
    sans-serif;

  background:#fff8ed;
  color:#4b2b0b;
}


/* =========================
   HEADER
========================= */

.header{
  background:
    linear-gradient(
      135deg,
      #f28c00,
      #ffb52e
    );

  color:white;

  padding:12px;

  display:flex;
  align-items:center;

  gap:10px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.15);
}

.header img{
  width:48px;
  height:48px;

  object-fit:contain;

  background:white;

  border-radius:50%;

  padding:4px;
}

.header-text{
  flex:1;
}

.header-text h1{
  font-size:18px;
  line-height:1.3;
}

.header-text p{
  font-size:11px;
  margin-top:2px;
}


/* =========================
   CONTAINER
========================= */

.container{
  max-width:850px;
  margin:auto;
  padding:12px;
}


/* =========================
   LOGIN
========================= */

.login-box{

  background:white;

  border:1px solid #ecd3ae;

  border-radius:12px;

  padding:15px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.07);

  margin-top:10px;
}

.login-title{

  text-align:center;

  color:#d86f00;

  font-size:20px;

  margin-bottom:5px;
}

.login-subtitle{

  text-align:center;

  color:#80684c;

  font-size:12px;

  margin-bottom:15px;
}


/* =========================
   INPUT
========================= */

.field{
  margin-bottom:11px;
}

.field label{

  display:block;

  font-size:12px;

  margin-bottom:4px;

  color:#704d2b;
}

.field input{

  width:100%;

  padding:10px;

  border:1px solid #dfc49f;

  border-radius:8px;

  outline:none;

  font-size:14px;

  background:#fffdfa;
}

.field input:focus{

  border-color:#f28c00;
}


/* =========================
   BUTTON
========================= */

.button{

  width:100%;

  border:0;

  border-radius:8px;

  padding:11px;

  background:#f28c00;

  color:white;

  font-size:14px;

  cursor:pointer;
}

.button:disabled{

  opacity:.6;

  cursor:not-allowed;
}


/* =========================
   LOGIN ERROR
========================= */

.login-error{

  display:none;

  margin-top:10px;

  padding:9px;

  border-radius:8px;

  background:#fff0f0;

  border:1px solid #e5aaaa;

  color:#a52d2d;

  font-size:12px;
}


/* =========================
   TOP BAR
========================= */

.topbar{

  display:flex;

  gap:7px;

  align-items:center;

  margin-bottom:10px;
}

.search{

  flex:1;

  padding:10px;

  border:1px solid #dfc49f;

  border-radius:8px;

  outline:none;

  background:white;

  font-size:13px;
}

.logout{

  border:0;

  background:#fff;

  border:1px solid #e0bd8b;

  color:#a75e0b;

  border-radius:8px;

  padding:9px;

  font-size:11px;

  cursor:pointer;
}


/* =========================
   LIST
========================= */

.list{

  display:flex;

  flex-direction:column;

  gap:7px;
}

.registration{

  background:white;

  border:1px solid #ecd8bc;

  border-radius:9px;

  padding:7px;

  display:flex;

  align-items:center;

  gap:9px;

  cursor:pointer;

  box-shadow:
    0 1px 4px rgba(0,0,0,.05);

  transition:.15s;
}

.registration:active{

  transform:scale(.99);
}


/* =========================
   THUMB
========================= */

.thumb{

  width:50px;

  height:50px;

  object-fit:cover;

  flex:none;

  border-radius:7px;

  background:#f4e7d3;
}


/* =========================
   BASIC
========================= */

.basic{

  min-width:0;

  flex:1;
}

.name{

  font-size:14px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.place{

  font-size:11px;

  color:#80684c;

  margin-top:2px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.regid{

  font-size:9px;

  color:#a06c2e;

  margin-top:2px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.arrow{

  font-size:18px;

  color:#f28c00;
}


/* =========================
   STATUS
========================= */

.status{

  text-align:center;

  padding:20px;

  font-size:13px;

  color:#765532;
}

.error{

  background:#fff0f0;

  border:1px solid #e4aaaa;

  color:#a12b2b;

  border-radius:8px;

  padding:10px;

  font-size:12px;
}


/* =========================
   DETAIL
========================= */

.detail{

  display:none;
}

.back{

  border:0;

  background:#f28c00;

  color:white;

  border-radius:7px;

  padding:8px 12px;

  font-size:12px;

  margin-bottom:10px;

  cursor:pointer;
}

.detail-card{

  background:white;

  border:1px solid #ecd8bc;

  border-radius:11px;

  padding:12px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.06);
}


/* =========================
   DETAIL PHOTO
========================= */

.detail-photo{

  text-align:center;

  margin-bottom:10px;
}

.detail-photo img{

  width:150px;

  height:175px;

  object-fit:cover;

  border-radius:9px;

  border:2px solid #f1bd70;
}


/* =========================
   DETAIL TITLE
========================= */

.detail-title{

  text-align:center;

  font-size:18px;

  color:#d86f00;

  margin-bottom:3px;
}

.detail-id{

  text-align:center;

  font-size:10px;

  color:#856747;

  margin-bottom:10px;
}


/* =========================
   ROW
========================= */

.row{

  border-bottom:1px solid #f0e2cf;

  padding:7px 2px;
}

.row:last-child{

  border-bottom:0;
}

.label{

  font-size:10px;

  color:#8b6a49;

  margin-bottom:2px;
}

.value{

  font-size:13px;

  white-space:pre-wrap;

  word-break:break-word;

  color:#422a12;
}


/* =========================
   SECTION
========================= */

.section-title{

  color:#d86f00;

  font-size:15px;

  margin-top:14px;

  margin-bottom:4px;
}


/* =========================
   DESKTOP / TABLET
========================= */

@media(min-width:700px){

  .container{

    padding:18px;
  }

  .registration:hover{

    border-color:#efb35b;

    transform:translateY(-1px);
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <img
    src="logo.png"
    alt="Logo"
  >

  <div class="header-text">

    <h1>
      गायत्री चेतना केन्द्र चिलबिला, प्रतापगढ़
    </h1>

    <p>
      अखिल विश्व गायत्री परिवार, शान्तिकुञ्ज, हरिद्वार
    </p>

  </div>

</header>



<main class="container">


<!-- =========================
     LOGIN
========================= -->

<section
  id="loginView"
  class="login-box"
>

  <h2 class="login-title">
    पंजीकरण सूची खोलें
  </h2>

  <p class="login-subtitle">
    Private GitHub Repository से डेटा देखने के लिए
    पहली बार विवरण भरें।
  </p>


  <div class="field">

    <label>
      GitHub Username
    </label>

    <input
      id="username"
      type="text"
      autocomplete="username"
      placeholder="GitHub username"
    >

  </div>


  <div class="field">

    <label>
      Private Repository Name
    </label>

    <input
      id="repo"
      type="text"
      placeholder="Issue वाली repository"
    >

  </div>


  <div class="field">

    <label>
      GitHub Token
    </label>

    <input
      id="token"
      type="password"
      autocomplete="current-password"
      placeholder="GitHub token"
    >

  </div>


  <button
    id="loginButton"
    class="button"
  >
    सुरक्षित रूप से खोलें
  </button>


  <div
    id="loginError"
    class="login-error"
  ></div>

</section>



<!-- =========================
     LIST VIEW
========================= -->

<section
  id="listView"
  style="display:none"
>


  <div class="topbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="नाम, स्थान या ID खोजें..."
    >


    <button
      id="logout"
      class="logout"
    >
      Logout
    </button>

  </div>


  <div
    id="list"
    class="list"
  ></div>

</section>



<!-- =========================
     DETAIL VIEW
========================= -->

<section
  id="detailView"
  class="detail"
>

  <button
    id="backButton"
    class="back"
  >
    ← वापस
  </button>


  <div
    id="detailCard"
    class="detail-card"
  ></div>

</section>


</main>



<script>


/* =================================================
   STORAGE KEY
================================================= */

const STORAGE_KEY =
  "gck_github_viewer_config_v1";



/* =================================================
   ELEMENTS
================================================= */

const loginView =
  document.getElementById(
    "loginView"
  );

const listView =
  document.getElementById(
    "listView"
  );

const detailView =
  document.getElementById(
    "detailView"
  );

const usernameInput =
  document.getElementById(
    "username"
  );

const repoInput =
  document.getElementById(
    "repo"
  );

const tokenInput =
  document.getElementById(
    "token"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const logoutButton =
  document.getElementById(
    "logout"
  );

const search =
  document.getElementById(
    "search"
  );

const list =
  document.getElementById(
    "list"
  );

const detailCard =
  document.getElementById(
    "detailCard"
  );

const backButton =
  document.getElementById(
    "backButton"
  );



/* =================================================
   DATA
================================================= */

let config = null;

let registrations = [];



/* =================================================
   LOAD SAVED CONFIG
================================================= */

function loadSavedConfig(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!saved){

      return false;

    }


    config =
      JSON.parse(saved);


    if(
      !config.username ||
      !config.repo ||
      !config.token
    ){

      localStorage.removeItem(
        STORAGE_KEY
      );

      return false;

    }


    return true;

  }catch{

    localStorage.removeItem(
      STORAGE_KEY
    );

    return false;

  }

}



/* =================================================
   SAVE CONFIG
================================================= */

function saveConfig(){

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify({

      username:
        config.username,

      repo:
        config.repo,

      token:
        config.token

    })

  );

}



/* =================================================
   GITHUB ISSUES
================================================= */

async function getIssues(){

  const url =
    `https://api.github.com/repos/` +
    `${encodeURIComponent(config.username)}/` +
    `${encodeURIComponent(config.repo)}` +
    `/issues?state=open&per_page=100`;


  let response;


  try{

    response =
      await fetch(

        url,

        {

          headers:{

            "Accept":
              "application/vnd.github+json",

            "Authorization":
              `Bearer ${config.token}`,

            "X-GitHub-Api-Version":
              "2022-11-28"

          }

        }

      );

  }catch(error){

    throw new Error(
      "GitHub से connection नहीं हो सका। Internet connection check करें।"
    );

  }


  let data = null;


  try{

    data =
      await response.json();

  }catch{}


  if(!response.ok){

    let message =
      data?.message ||
      "GitHub ने request स्वीकार नहीं की।";


    if(response.status === 401){

      message =
        "Token गलत, expired या invalid है।";

    }

    else if(response.status === 403){

      message =
        "GitHub ने access रोक दिया। Token permission check करें।";

    }

    else if(response.status === 404){

      message =
        "Repository नहीं मिली। Username और repository name check करें।";

    }


    throw new Error(
      `GitHub Error ${response.status}: ${message}`
    );

  }


  return data;

}



/* =================================================
   PARSE ISSUE
================================================= */

function parseIssue(issue){

  const body =
    issue.body || "";


  function get(label){

    const regex =
      new RegExp(
        "\\*\\*" +
        escapeRegex(label) +
        ":\\*\\*\\s*(.*)",
        "i"
      );


    const match =
      body.match(regex);


    return match
      ? match[1].trim()
      : "";

  }


  let anshdaan = "";

  let samaydaan = "";


  const anshMatch =
    body.match(
      /## अंशदान\s*([\s\S]*?)(?=---|## समयदान)/i
    );


  if(anshMatch){

    anshdaan =
      anshMatch[1]
        .trim();

  }


  const samayMatch =
    body.match(
      /## समयदान\s*([\s\S]*?)(?=---|## फोटो)/i
    );


  if(samayMatch){

    samaydaan =
      samayMatch[1]
        .trim();

  }


  let image = "";


  const imageMatch =
    body.match(
      /```text\s*([\s\S]*?)\s*```/
    );


  if(imageMatch){

    image =
      imageMatch[1].trim();

  }


  return {

    issueNumber:
      issue.number,

    id:
      get("पंजीकरण क्रमांक"),

    name:
      get("नाम"),

    fatherName:
      get("पिता का नाम"),

    mobile:
      get("मोबाइल नंबर"),

    age:
      get("आयु"),

    dikshaDate:
      get("दीक्षा की तिथि"),

    dikshaPlace:
      get("दीक्षा का स्थान"),

    city:
      get("शहर / कस्बा / ग्राम"),

    education:
      get("शिक्षा"),

    income:
      get("आय / Income"),

    anshdaan,

    samaydaan,

    image

  };

}



/* =================================================
   LOGIN
================================================= */

loginButton.addEventListener(
  "click",
  async () => {

    const username =
      usernameInput.value.trim();

    const repo =
      repoInput.value.trim();

    const token =
      tokenInput.value.trim();


    loginError.style.display =
      "none";


    if(
      !username ||
      !repo ||
      !token
    ){

      loginError.textContent =
        "Username, Repository और Token तीनों भरें।";

      loginError.style.display =
        "block";

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Verify किया जा रहा है…";


    config = {

      username,

      repo,

      token

    };


    try{

      const issues =
        await getIssues();


      saveConfig();


      registrations =
        issues
          .filter(
            issue =>
              !issue.pull_request
          )
          .map(
            parseIssue
          );


      loginView.style.display =
        "none";

      listView.style.display =
        "block";


      renderList(
        registrations
      );


    }catch(error){

      loginError.textContent =
        "❌ " +
        error.message;

      loginError.style.display =
        "block";

      config = null;

    }finally{

      loginButton.disabled =
        false;

      loginButton.textContent =
        "सुरक्षित रूप से खोलें";

    }

  }
);



/* =================================================
   RENDER LIST
================================================= */

function renderList(data){

  if(!data.length){

    list.innerHTML =
      `<div class="status">
        कोई registration नहीं मिला।
      </div>`;

    return;

  }


  list.innerHTML = "";


  data.forEach(
    item => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "registration";


      const imageHTML =
        item.image

        ?

        `<img
          class="thumb"
          src="${escapeAttribute(
            item.image
          )}"
          alt="फोटो"
        >`

        :

        `<div class="thumb"></div>`;


      card.innerHTML = `

        ${imageHTML}

        <div class="basic">

          <div class="name">
            ${escapeHtml(
              item.name ||
              "नाम उपलब्ध नहीं"
            )}
          </div>

          <div class="place">
            प्रतापगढ़ —
            ${escapeHtml(
              item.city ||
              ""
            )}
          </div>

          <div class="regid">
            ${escapeHtml(
              item.id ||
              "Registration ID उपलब्ध नहीं"
            )}
          </div>

        </div>

        <div class="arrow">
          ›
        </div>

      `;


      card.addEventListener(
        "click",
        () =>
          showDetail(item)
      );


      list.appendChild(
        card
      );

    }
  );

}



/* =================================================
   DETAIL
================================================= */

function showDetail(item){

  listView.style.display =
    "none";

  detailView.style.display =
    "block";


  const imageHTML =
    item.image

    ?

    `
    <div class="detail-photo">

      <img
        src="${escapeAttribute(
          item.image
        )}"
        alt="फोटो"
      >

    </div>
    `

    :

    "";


  detailCard.innerHTML = `

    ${imageHTML}


    <h2 class="detail-title">

      ${escapeHtml(
        item.name ||
        "पंजीकरण विवरण"
      )}

    </h2>


    <div class="detail-id">

      ${escapeHtml(
        item.id ||
        ""
      )}

    </div>


    ${makeRow(
      "नाम",
      item.name
    )}

    ${makeRow(
      "पिता का नाम",
      item.fatherName
    )}

    ${makeRow(
      "मोबाइल नंबर",
      item.mobile
    )}

    ${makeRow(
      "आयु",
      item.age
    )}

    ${makeRow(
      "दीक्षा की तिथि",
      item.dikshaDate
    )}

    ${makeRow(
      "दीक्षा का स्थान",
      item.dikshaPlace
    )}

    ${makeRow(
      "जिला",
      "प्रतापगढ़ (उ.प्र.)"
    )}

    ${makeRow(
      "शहर / कस्बा / ग्राम",
      item.city
    )}

    ${makeRow(
      "शिक्षा",
      item.education
    )}

    ${makeRow(
      "आय / Income",
      item.income
    )}


    <h3 class="section-title">
      आपके द्वारा किया गया दान
    </h3>


    ${makeRow(
      "अंशदान",
      item.anshdaan ||
      "कोई विवरण नहीं दिया गया।"
    )}


    ${makeRow(
      "समयदान",
      item.samaydaan ||
      "कोई विवरण नहीं दिया गया।"
    )}

  `;


  window.scrollTo(
    0,
    0
  );

}



/* =================================================
   ROW
================================================= */

function makeRow(
  label,
  value
){

  return `

    <div class="row">

      <div class="label">
        ${escapeHtml(
          label
        )}
      </div>

      <div class="value">
        ${escapeHtml(
          value ||
          "—"
        )}
      </div>

    </div>

  `;

}



/* =================================================
   SEARCH
================================================= */

search.addEventListener(
  "input",
  () => {

    const q =
      search.value
        .trim()
        .toLowerCase();


    if(!q){

      renderList(
        registrations
      );

      return;

    }


    const filtered =
      registrations.filter(
        item =>

          [
            item.name,
            item.city,
            item.id,
            item.fatherName,
            item.mobile
          ]
          .join(" ")
          .toLowerCase()
          .includes(q)

      );


    renderList(
      filtered
    );

  }
);



/* =================================================
   BACK
================================================= */

backButton.addEventListener(
  "click",
  () => {

    detailView.style.display =
      "none";

    listView.style.display =
      "block";

    window.scrollTo(
      0,
      0
    );

  }
);



/* =================================================
   LOGOUT
================================================= */

logoutButton.addEventListener(
  "click",
  () => {

    localStorage.removeItem(
      STORAGE_KEY
    );


    config = null;

    registrations = [];


    listView.style.display =
      "none";

    detailView.style.display =
      "none";

    loginView.style.display =
      "block";


    usernameInput.value =
      "";

    repoInput.value =
      "";

    tokenInput.value =
      "";

  }
);



/* =================================================
   ESCAPE
================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(value){

  return String(
    value ?? ""
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}


function escapeRegex(value){

  return String(value)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );

}
